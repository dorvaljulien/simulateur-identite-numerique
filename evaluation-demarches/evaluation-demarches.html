<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Évaluation — Démarches en ligne et identité numérique</title>
<style>
/* ============ COQUE DE L'ÉVALUATION ============ */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Segoe UI", system-ui, Arial, sans-serif; font-size: 15px; color: #222; background: #eceef1; }
button, input, textarea, select { font-family: inherit; }
.hidden { display: none !important; }

/* En-tête : où j'en suis (partie + étapes) et combien de temps il reste */
#evtop { position: fixed; left: 0; right: 0; top: 0; height: 60px; z-index: 50; display: flex; align-items: center; gap: 16px; padding: 0 14px; background: #2b2e33; color: #c9ccd1; font-size: 12px; white-space: nowrap; }
#evtop .partname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #fff; font-size: 18px; font-weight: 700; line-height: 1.1; }
#evtop .partname small { display: block; font-size: 12px; font-weight: 600; color: #ffd479; letter-spacing: .02em; margin-bottom: 2px; }
#evtop .steps { display: flex; gap: 5px; }
#evtop .steps span { padding: 5px 10px; border-radius: 12px; background: #44474d; color: #9a9ea6; font-weight: 700; font-size: 13px; }
#evtop .steps span.done { background: #2f6b3f; color: #d4f0db; }
#evtop .steps span.cur { background: #ffd479; color: #222; box-shadow: 0 0 0 2px #fff; }
#evtop .chrono { position: relative; overflow: hidden; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 5px 14px 8px; border-radius: 8px; background: #1f6f43; color: #fff; min-width: 250px; }
#evtop .chrono .lbl { grid-column: 1 / 3; font-size: 11.5px; font-weight: 600; opacity: .9; }
#evtop .chrono .val { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: .02em; }
#evtop .chrono .sur { font-size: 12.5px; opacity: .9; }
#evtop .chrono i { position: absolute; left: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.75); transition: width .9s linear; }
#evtop .chrono.last { background: #c77700; }
#evtop .chrono.over { background: #b4441c; }
#evtop .total { display: flex; flex-direction: column; align-items: center; line-height: 1.15; color: #b9bdc4; }
#evtop .total b { color: #fff; font-size: 16px; font-variant-numeric: tabular-nums; }
#evtop .idc { opacity: .5; font-family: Consolas, monospace; font-size: 11px; }
#evtop .idc::after { content: "sites fictifs"; display: block; font-family: "Segoe UI", system-ui, Arial, sans-serif; }

#evmain { position: absolute; top: 60px; left: 0; right: 0; bottom: 0; overflow: auto; }
#evmain.sim { overflow: hidden; }

.page { max-width: 1060px; margin: 0 auto; padding: 18px 22px 90px; }
.page h1 { font-size: 22px; margin: 4px 0 4px; color: #1d2733; }
.page .consigne { background: #fff; border-left: 5px solid #3b5b8c; padding: 10px 14px; margin: 10px 0 18px; line-height: 1.5; border-radius: 0 6px 6px 0; }
.page .consigne b { color: #1d3b66; }

.footbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(255,255,255,.96); border-top: 1px solid #d5d8dd; padding: 10px 22px; display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
.footbar .info { flex: 1; font-size: 13px; color: #666; }
.btn { background: #3b5b8c; color: #fff; border: 0; border-radius: 6px; padding: 10px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn:hover { background: #2d4a76; }
.btn.ghost { background: #fff; color: #3b5b8c; border: 1px solid #3b5b8c; }
.btn.warn { background: #b45309; }
.btn:disabled { background: #b8bec7; cursor: default; }

textarea, input.txt { width: 100%; border: 1px solid #b9c0ca; border-radius: 6px; padding: 8px 10px; font-size: 15px; line-height: 1.4; background: #fff; }
textarea:focus, input.txt:focus { outline: 2px solid #8ab4f8; border-color: #5b86c6; }
textarea[readonly], input.txt[readonly] { background: #f2f3f5; color: #555; }
label.q { display: block; font-weight: 600; margin: 12px 0 5px; color: #2a3340; }
.count { font-size: 11.5px; color: #999; text-align: right; }

/* ---------- Accueil ---------- */
.welcome { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle at 30% 20%, #3f4b63, #1d222c); color: #fff; display: flex; align-items: center; justify-content: center; overflow: auto; }
.welcome .wbox { width: 900px; max-width: 94vw; display: grid; grid-template-columns: 1fr 330px; gap: 34px; padding: 20px 0; }
.welcome h1 { font-size: 28px; margin: 0 0 4px; font-weight: 600; }
.welcome .sub { color: #ffd479; margin-bottom: 16px; }
.welcome ul { line-height: 1.65; padding-left: 20px; font-size: 15px; margin: 0; }
.welcome .warn { font-size: 13px; color: #c9cfdb; margin-top: 16px; border-left: 3px solid #ffd479; padding-left: 10px; line-height: 1.5; }
.welcome .codebox { background: #faf7f0; color: #222; border-radius: 10px; padding: 22px; align-self: center; }
.welcome .codebox h2 { margin: 0 0 6px; font-size: 18px; }
.welcome .codebox p { font-size: 13px; color: #555; margin: 0 0 12px; line-height: 1.45; }
.welcome .codebox input { width: 100%; height: 50px; font-size: 28px; letter-spacing: 10px; text-align: center; border: 2px solid #b9c0ca; border-radius: 8px; font-family: Consolas, monospace; }
.welcome .codebox .err { color: #b3261e; font-size: 13px; min-height: 18px; margin-top: 6px; }
.welcome .codebox .btn { width: 100%; margin-top: 8px; background: #ffd479; color: #222; }
.welcome .codebox .btn:hover { background: #f5c75c; }
.welcome .resume { margin-top: 12px; padding: 12px; background: #fff3d6; border-radius: 6px; font-size: 13px; line-height: 1.45; }

/* ---------- Fenêtres modales ---------- */
.overlay { position: fixed; inset: 0; background: rgba(25,27,31,.6); z-index: 200; display: flex; align-items: center; justify-content: center; }
.modal { background: #fff; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.4); max-width: 94vw; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
.modal .mh { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid #e3e3e3; background: #f7f7f5; }
.modal .mh h2 { flex: 1; margin: 0; font-size: 16px; }
.modal .mh .close { cursor: pointer; font-size: 20px; color: #666; padding: 0 6px; }
.modal .mb { overflow: auto; padding: 16px 18px; line-height: 1.5; }
.modal .mf { display: flex; justify-content: flex-end; gap: 10px; padding: 10px 16px; border-top: 1px solid #eee; }
.confirm { width: 460px; }

#toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 300; box-shadow: 0 4px 14px rgba(0,0,0,.3); max-width: 600px; }

/* ---------- 1A : cartes ---------- */
.c1a { display: grid; grid-template-columns: 1fr 330px; gap: 18px; background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.c1a .num { font-weight: 700; color: #3b5b8c; font-size: 13px; margin-bottom: 6px; }
.c1a .mock { background: #f6f7f9; border-radius: 8px; padding: 14px; display: flex; align-items: center; justify-content: center; min-height: 120px; }
.c1a .ans { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.choice2 { display: flex; gap: 8px; }
.choice2 button { flex: 1; padding: 10px 6px; border: 2px solid #b9c0ca; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; color: #444; }
.choice2 button:hover { border-color: #5b86c6; }
.choice2 button.on { border-color: #3b5b8c; background: #3b5b8c; color: #fff; }
.c1a .ans input { font-size: 14px; }

/* maquette : résultat de recherche */
.mk-search { width: 100%; max-width: 560px; background: #fff; border-radius: 8px; border: 1px solid #e4e6ea; padding: 0 0 12px; font-family: Arial, sans-serif; color: #202124; }
.mk-search .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
.mk-search .bar .lg { font-family: "Trebuchet MS", Arial; font-weight: 700; font-size: 16px; color: #e8590c; }
.mk-search .bar .q { flex: 1; border: 1px solid #dfe1e5; border-radius: 14px; padding: 3px 12px; font-size: 12px; color: #555; }
.mk-search .r { padding: 0 14px; }
.mk-search .spons { font-weight: 700; font-size: 12px; color: #202124; margin-bottom: 3px; }
.mk-search .site { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.mk-search .site .f { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.mk-search .site .nm { color: #202124; }
.mk-search .site .u { color: #4d5156; font-size: 12.5px; }
.mk-search h3 { margin: 6px 0 3px; font-size: 17px; font-weight: 400; color: #1a0dab; }
.mk-search p { margin: 0; font-size: 13px; line-height: 1.45; color: #4d5156; }

/* maquette : téléphone (SMS, story) */
.mk-phone { width: 230px; background: #16171a; border-radius: 22px; padding: 8px; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
.mk-phone .scr { background: #fff; border-radius: 15px; overflow: hidden; min-height: 210px; font-family: Arial, sans-serif; }
.mk-phone .sbar { display: flex; justify-content: space-between; font-size: 10px; padding: 4px 12px; color: #333; }
.mk-phone .who { text-align: center; padding: 4px 0 8px; border-bottom: 1px solid #eee; font-size: 12px; }
.mk-phone .who .av { width: 30px; height: 30px; border-radius: 50%; background: #9aa0a6; color: #fff; margin: 0 auto 3px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.mk-phone .bub { margin: 12px 10px; background: #e9e9eb; border-radius: 14px; padding: 9px 11px; font-size: 13px; line-height: 1.4; color: #111; overflow-wrap: anywhere; }
.mk-phone .bub u { color: #1a5bb5; white-space: nowrap; }
.mk-phone .tm { text-align: center; font-size: 10px; color: #999; margin-top: 8px; }
.mk-story .scr { background: linear-gradient(160deg, #f58529, #dd2a7b 50%, #8134af); color: #fff; min-height: 300px; position: relative; padding: 10px 12px; }
.mk-story .prog { height: 3px; background: rgba(255,255,255,.4); border-radius: 2px; margin-bottom: 8px; } .mk-story .prog i { display: block; width: 40%; height: 100%; background: #fff; border-radius: 2px; }
.mk-story .acc { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; }
.mk-story .acc .av { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #dd2a7b; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.mk-story .acc small { font-weight: 400; opacity: .8; }
.mk-story .big { margin-top: 52px; background: rgba(0,0,0,.28); border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; line-height: 1.4; text-align: center; overflow-wrap: anywhere; }
.mk-story .lnk { margin: 16px auto 0; background: #fff; color: #222; border-radius: 16px; padding: 5px 12px; font-size: 12px; width: max-content; max-width: 100%; overflow-wrap: anywhere; }

/* maquette : réseau social */
.mk-post { width: 100%; max-width: 520px; background: #fff; border: 1px solid #dddfe2; border-radius: 8px; font-family: Arial, sans-serif; }
.mk-post .grp { background: #eef1f6; padding: 6px 12px; font-size: 12px; color: #555; border-bottom: 1px solid #e4e6eb; border-radius: 8px 8px 0 0; }
.mk-post .hd { display: flex; gap: 9px; align-items: center; padding: 10px 12px 4px; }
.mk-post .hd .av { width: 36px; height: 36px; border-radius: 50%; background: #c7a27c; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.mk-post .hd b { font-size: 14px; display: block; } .mk-post .hd small { color: #65676b; font-size: 12px; }
.mk-post .tx { padding: 6px 12px 10px; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.mk-post .tx u { color: #385898; white-space: nowrap; }
.mk-post .ft { border-top: 1px solid #e4e6eb; margin: 0 12px; padding: 7px 0; font-size: 12px; color: #65676b; display: flex; justify-content: space-between; }

/* maquette : assistant IA */
.mk-ia { width: 100%; max-width: 520px; background: #fff; border: 1px solid #e3e3e8; border-radius: 10px; padding: 12px; font-family: Arial, sans-serif; }
.mk-ia .hd { font-size: 12px; color: #666; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.mk-ia .hd i { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #7b6cf6, #3fb8af); display: inline-block; }
.mk-ia .u { margin-left: auto; width: max-content; max-width: 80%; background: #eef0ff; border-radius: 14px 14px 2px 14px; padding: 8px 12px; font-size: 13.5px; margin-bottom: 10px; }
.mk-ia .a { display: flex; gap: 8px; font-size: 14px; line-height: 1.5; }
.mk-ia .a i { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, #7b6cf6, #3fb8af); flex-shrink: 0; }
.mk-ia .a span { overflow-wrap: anywhere; }

/* maquette : flyer */
.mk-flyer { width: 300px; background: #fffbe6; border: 1px solid #e6dca3; padding: 16px 18px; box-shadow: 2px 3px 8px rgba(0,0,0,.18); transform: rotate(-1.5deg); font-family: Arial, sans-serif; text-align: center; }
.mk-flyer h4 { margin: 0 0 8px; font-size: 22px; color: #b3261e; letter-spacing: .03em; }
.mk-flyer p { font-size: 13px; line-height: 1.4; margin: 0 0 10px; }
.mk-flyer .qr { width: 74px; height: 74px; margin: 0 auto 8px; background:
  repeating-linear-gradient(90deg, #222 0 6px, transparent 6px 10px), repeating-linear-gradient(0deg, #222 0 5px, transparent 5px 11px); opacity: .85; border: 6px solid #fff; outline: 2px solid #222; }
.mk-flyer .lnk { font-family: Consolas, monospace; font-size: 15px; font-weight: 700; }

/* ---------- 1B ---------- */
.sit { background: #fff; border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.sit h2 { margin: 0 0 8px; font-size: 16px; color: #3b5b8c; }
.sit .dit { display: flex; gap: 10px; align-items: flex-start; background: #f5f1e8; border-radius: 10px; padding: 10px 12px; font-size: 15px; line-height: 1.45; font-style: italic; }
.sit .dit .av { font-style: normal; font-size: 26px; }

/* ---------- 2A : classement par glisser-déposer ---------- */
.rank2 { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: stretch; }
.rank2 .axe { display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 4px 0; border-radius: 10px;
  background: linear-gradient(#d8f0de, #f7f7f7 50%, #f8dcd6); font-weight: 700; font-size: 14px; color: #333; text-align: center; }
.rank2 .axe .top { color: #1f6f43; } .rank2 .axe .bot { color: #a2381e; }
.rank2 .axe .mid { font-size: 22px; color: #999; line-height: 1; }
.rank { list-style: none; padding: 0; margin: 0; }
.rank li { display: grid; grid-template-columns: 26px 44px 1fr; align-items: center; gap: 12px; background: #fff; border: 2px solid #d5d8dd; border-left-width: 8px;
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 15.5px; line-height: 1.35; cursor: grab; user-select: none; touch-action: none; position: relative; }
.rank li:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.rank li .grip { color: #9aa1ab; font-size: 22px; line-height: 1; letter-spacing: -2px; }
.rank li .lt { width: 40px; height: 40px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center; }
.rank li.dragging { cursor: grabbing; z-index: 5; box-shadow: 0 8px 22px rgba(0,0,0,.25); transition: none; }
.rank li.moved { animation: mv .5s; }
@keyframes mv { from { background: #fff4c7; } to { background: #fff; } }
.astuce { font-size: 13px; color: #555; margin: 0 0 10px; }

/* ---------- 2C ---------- */
.question-visible { background: #fff7dd; border: 2px solid #e0b43a; border-radius: 10px; padding: 12px 16px; margin: 10px 0 16px; font-size: 16px; line-height: 1.5; }
.question-visible .qq { font-size: 19px; font-weight: 800; color: #5b4200; }
.yn-head { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: 1fr 230px; gap: 12px; padding: 8px 14px; margin-bottom: 6px;
  background: #3b5b8c; color: #fff; border-radius: 8px; font-weight: 700; font-size: 14px; }
.yn-head span:last-child { text-align: center; }
.yn { background: #fff; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.yn .row { display: grid; grid-template-columns: 1fr 230px; gap: 12px; align-items: center; font-size: 15px; }
.yn .star { color: #c58a00; font-weight: 700; }
.yn input { margin-top: 8px; font-size: 14px; }

/* ---------- 1B : questions à poser ---------- */
.qpair { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; align-items: center; }
.qpair span { font-size: 14px; color: #3b5b8c; font-weight: 600; }
.aide-q { font-size: 13px; color: #555; margin: -2px 0 6px; }

/* ---------- 2D : rappel du vrai nom, question 3 ---------- */
.envrai { color: #5b4200; background: #fff1c2; border-radius: 4px; padding: 0 5px; }
.q3grid { display: grid; grid-template-columns: max-content max-content 320px; gap: 10px 12px; align-items: center; }
.q3grid .eg { color: #555; font-size: 14px; }
.q3grid select { font-size: 15px; padding: 7px 8px; border: 1px solid #b9c0ca; border-radius: 6px; background: #fff; }

/* Logos image (dossier logos/) */
.logo-img { display: block; width: auto; max-width: 260px; object-fit: contain; }
.ico-img { width: 100%; height: 100%; object-fit: contain; display: block; }

/* ---------- Fin ---------- */
.endbox { max-width: 620px; margin: 40px auto; background: #fff; border-radius: 10px; padding: 26px 30px; box-shadow: 0 4px 18px rgba(0,0,0,.1); text-align: center; line-height: 1.5; }
.endbox h1 { margin-top: 0; }
.endbox .ok { color: #1b5e20; font-weight: 700; font-size: 18px; margin: 14px 0; }
.endbox .big { font-size: 17px; padding: 14px 30px; margin: 10px 0; }

/* ============ PARTIE 2D : prédiction, questions de fin ============ */
.pred { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.mission { background: #fff7e0; border: 1px solid #f0d9a8; border-radius: 8px; padding: 10px 14px; line-height: 1.5; margin: 8px 0 14px; }

/* Carte personnage (même style que le simulateur Identité numérique) */
.carte { width: 680px; }
.carte .mb { background: #faf7f0; }
.carteinline { background: #faf7f0; border-radius: 10px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.idcard { display: grid; grid-template-columns: 96px 1fr; gap: 14px; font-size: 13.5px; }
.idcard .photo { width: 96px; height: 116px; border-radius: 8px; background: linear-gradient(#c9b9a6, #a8927a); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; font-size: 64px; }
.idcard h3 { margin: 0 0 2px; font-size: 20px; }
.idcard .sub { color: #666; margin-bottom: 8px; }
.idcard table { border-collapse: collapse; width: 100%; }
.idcard td { padding: 3px 6px 3px 0; vertical-align: top; line-height: 1.35; }
.idcard td:first-child { color: #777; width: 128px; }
.idcard code { font-family: Consolas, monospace; font-size: 13.5px; background: #fff; padding: 0 4px; border-radius: 3px; border: 1px solid #e6dfcf; }
.postit { background: #fff59d; padding: 8px 12px; margin-top: 12px; font-family: "Comic Sans MS", "Segoe Print", cursive; font-size: 13px; transform: rotate(-.6deg); box-shadow: 2px 3px 6px rgba(0,0,0,.18); line-height: 1.5; }

/* ============ COQUE DU SIMULATEUR ============ */
#sim { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); background: #d9dce1; font-size: 14px; }
#simbar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; min-height: 38px; background: #fff7e0; border-bottom: 1px solid #e6d3a3; font-size: 13px; }
#simbar .mtx { flex: 1; min-width: 0; line-height: 1.3; font-size: 12.5px; }
#simbar .mtx b { color: #8a5a00; margin-right: 4px; }
#simbar button { height: 28px; border-radius: 5px; padding: 0 12px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #b9a77a; background: #fff; color: #4a3d1c; white-space: nowrap; }
#simbar button.end { background: #3b5b8c; border-color: #3b5b8c; color: #fff; }
#simmain { display: grid; grid-template-columns: minmax(0, 1fr) 292px; min-height: 0; }

/* --- Navigateur fictif --- */
#browser { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fff; border-right: 1px solid #aaa; position: relative; }
#tabstrip { display: flex; align-items: flex-end; height: 32px; background: #dee1e6; padding: 0 6px; gap: 2px; flex-shrink: 0; }
.btab { display: flex; align-items: center; gap: 7px; height: 27px; max-width: 240px; flex: 0 1 240px; padding: 0 8px 0 10px; border-radius: 8px 8px 0 0; font-size: 12px; color: #3c4043; background: #fff; }
.btab .fav { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; }

function tick() {
  const t = Date.now(), dt = (t - dernierTick) / 1000; dernierTick = t;
  if (!E || E.exporte) return;
  if (dt > 0 && dt < 30) {   // un trou (onglet fermé) ne compte pas
    E.durees[E.partie] = (E.durees[E.partie] || 0) + dt;
    if (typeof simTick === 'function') simTick(dt);
  }
  majEnTete();
}
setInterval(() => { tick(); }, 1000);
setInterval(() => { sauver(); }, 5000);

function totalSecondes() { return Object.values(E.durees).reduce((a, b) => a + b, 0); }

/* ---------- En-tête : progression + temps ---------- */
function majEnTete() {
  const top = $('#evtop'); if (!top || !E) return;
  const p = E.partie, conseil = CONFIG.tempsConseilles[p];
  const ecoule = E.durees[p] || 0;
  const liste = PARTIES.filter(x => x !== 'fin'), rang = liste.indexOf(p);
  $('.partname', top).innerHTML = p === 'fin' ? `<small>C'est fini !</small>${h(NOMS_PARTIES[p])}`
    : `<small>Partie ${rang + 1} sur ${liste.length} · ${p}</small>${h(NOMS_PARTIES[p])}`;
  $('.steps', top).innerHTML = liste.map(x => `<span class="${E.valides[x] ? 'done' : x === p ? 'cur' : ''}">${E.valides[x] ? '✓ ' : ''}${x}</span>`).join('');
  // Chronomètre de la partie : temps restant (compte à rebours), puis dépassement
  const chrono = $('.chrono', top);
  if (conseil) {
    const total = conseil * 60, reste = total - ecoule;
    const etat = reste < 0 ? 'over' : reste < 60 ? 'last' : '';
    chrono.className = 'chrono ' + etat;
    chrono.innerHTML = reste >= 0
      ? `<span class="lbl">Temps restant pour cette partie</span><span class="val">${mmss(reste)}</span><span class="sur">sur ${conseil} min</span><i style="width:${Math.min(100, 100 * ecoule / total).toFixed(1)}%"></i>`
      : `<span class="lbl">Temps conseillé dépassé de</span><span class="val">+${mmss(-reste)}</span><span class="sur">passez à la suite</span><i style="width:100%"></i>`;
  } else { chrono.className = 'chrono hidden'; chrono.innerHTML = ''; }
  const totConseil = Object.values(CONFIG.tempsConseilles).reduce((a, b) => a + b, 0);
  $('.total', top).innerHTML = `Temps total<b>${Math.floor(totalSecondes() / 60)} min</b><small>sur ${totConseil} min</small>`;
  $('.idc', top).textContent = E.idCopie;
}

function montrerEnTete() {
  if ($('#evtop')) return;
  const d = document.createElement('div'); d.id = 'evtop';
  d.innerHTML = `<span class="partname"></span><span class="steps"></span><span class="chrono"></span><span class="total"></span><span class="idc" title="Numéro de copie"></span>`;
  document.body.appendChild(d);
  const m = document.createElement('div'); m.id = 'evmain'; document.body.appendChild(m);
}

/* ---------- Fenêtres ---------- */
function confirmer(titre, texte, oui = 'Valider', non = 'Annuler') {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="modal confirm"><div class="mh"><h2>${titre}</h2></div><div class="mb">${texte}</div>
      <div class="mf">${non ? `<button class="btn ghost" data-r="0">${non}</button>` : ''}<button class="btn" data-r="1">${oui}</button></div></div>`;
    o.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { o.remove(); res(b.dataset.r === '1'); } });
    document.body.appendChild(o);
    setTimeout(() => { const b = $('[data-r="1"]', o); if (b) b.focus(); }, 30);
  });
}
let toastTimer = null;
function toast(msg, ms = 3200) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), ms);
}

/* ---------- Navigation entre parties ---------- */
function afficherPartie() {
  montrerEnTete(); majEnTete();
  const main = $('#evmain');
  main.className = ''; main.scrollTop = 0;
  $$('.footbar').forEach(f => f.remove());
  RENDUS[E.partie](main);
}

async function validerPartie(verifVide) {
  const vides = verifVide ? verifVide() : 0;
  const msg = (vides ? `<p style="color:#8a4b00"><b>Attention : ${vides} réponse${vides > 1 ? 's' : ''} ${vides > 1 ? 'sont vides' : 'est vide'}.</b></p>` : '') +
    '<p>Une fois cette partie validée, <b>vous ne pourrez plus revenir en arrière</b> pour la modifier.</p>';
  if (!await confirmer('Valider cette partie ?', msg, 'Valider', 'Revenir à la partie')) return false;
  E.valides[E.partie] = true;
  E.partie = PARTIES[PARTIES.indexOf(E.partie) + 1];
  sauver(); afficherPartie();
  return true;
}

function footbar(html, onValider, verifVide) {
  const f = document.createElement('div'); f.className = 'footbar';
  f.innerHTML = `<span class="info">${html || ''}</span><button class="btn" id="btnvalider">Valider cette partie</button>`;
  document.body.appendChild(f);
  $('#btnvalider', f).onclick = () => { if (onValider) onValider(); validerPartie(verifVide); };
  return f;
}

/* Enregistre la valeur d'un champ dans l'état à chaque frappe */
function lier(el, get, set) { el.value = get() || ''; el.addEventListener('input', () => { set(el.value); sauver(); }); }

/* ---------- Export ---------- */
function construireExport() {
  const v = V(), R = E.reponses;
  const out = {
    evaluation: CONFIG.evaluation, version: CONFIG.version, variante: E.variante, idCopie: E.idCopie,
    debut: E.debut, fin: E.fin || new Date().toISOString(),
    dureesParPartie: Object.fromEntries(Object.entries(E.durees).map(([k, s]) => [k, Math.round(s)])),
    reponses: {
      '1A': E.ordres['1A'].map((id, i) => { const c = v.cartes1A.find(x => x.id === id); const r = R['1A'][id] || {};
        return { item: id, ordreAffiche: i + 1, support: c.type, adresseOuLien: adresseCarte(c), choix: r.choix || null, justification: r.justification || '' }; }),
      '1B': { situation1: R['1B'].s1, questionFlash: R['1B'].flash, situation2: R['1B'].s3 },
      '2A': { classement: (R['2A'].classement || E.ordres['2A']).map((id, i) => ({ rang: i + 1, item: id, lettre: lettre2A(id), texte: CONFIG.motsDePasse.find(m => m.id === id).texte })),
        classementModifie: !!R['2A'].modifie, justification: R['2A'].justification },
      '2B': R['2B'],
      '2C': E.ordres['2C'].map((id, i) => { const s = v.situations2C.find(x => x.id === id); const r = R['2C'][id] || {};
        const o = { item: id, ordreAffiche: i + 1, situation: s.texte, reponse: r.reponse || null }; if (s.etoile) o.justification = r.justification || ''; return o; }),
      '2D': { prediction: R['2D'].prediction, formulaire: R['2D'].formulaire, questionsFin: R['2D'].questionsFin }
    },
    simulateur: E.sim ? exportSimulateur() : null
  };
  return JSON.stringify(out, null, 2);
}

async function exporterCopie() {
  if (!E.fin) { E.fin = new Date().toISOString(); sauver(); }
  const json = construireExport();
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  if (window.showSaveFilePicker) {
    try {
      const fh = await window.showSaveFilePicker({ suggestedName: 'evaluation-demarches.json', types: [{ description: 'Copie (JSON)', accept: { 'application/json': ['.json'] } }] });
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;   // l'élève a fermé la fenêtre
      /* sinon : on passe au téléchargement classique */
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'evaluation-demarches.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}

/* ---------- Remise à zéro (professeur) ---------- */
async function remiseAZero(demander = true) {

  effacerSauvegarde(); E = null; location.reload();
}
document.addEventListener('keydown', e => { if (e.ctrlKey && e.altKey && (e.key === 'r' || e.key === 'R')) { e.preventDefault(); remiseAZero(true); } });

        <li>Répondez avec vos mots, en phrases courtes. <b>N'écrivez pas votre nom.</b></li>
        <li>À la fin, vous enregistrerez votre copie avec le nom donné par le professeur.</li>
      </ul>
      <div class="warn">Tous les sites, noms et numéros du simulateur sont inventés. Ne saisissez jamais vos vraies informations.</div>
    </div><div class="codebox">
      <h2>Code de séance</h2><p>Saisissez le code écrit au tableau.</p>
      <input id="codeinput" maxlength="4" inputmode="numeric" autocomplete="off">
      <div class="err" id="codeerr"></div>
      <button class="btn" id="codeok">Commencer</button>
      <div id="resume"></div>
    </div></div>`;
  document.body.appendChild(w);
  const inp = $('#codeinput', w), err = $('#codeerr', w);
  inp.focus();
  const go = async () => {
    const code = inp.value.trim(); err.textContent = ''; $('#resume', w).innerHTML = '';
    if (code === CONFIG.codeRemiseAZero) { inp.value = ''; return remiseAZero(true); }
    const variante = CONFIG.codesSeance[code];
    if (!variante) { err.textContent = 'Code incorrect.'; inp.select(); return; }
    const sav = lireSauvegarde();
    if (sav && !sav.exporte && sav.evaluation === CONFIG.evaluation) {
      if (sav.variante !== variante) { err.textContent = 'Une autre copie est en cours sur cet ordinateur. Appelez le professeur.'; return; }
      $('#resume', w).innerHTML = `<div class="resume">Une copie commencée sur cet ordinateur n'a pas été enregistrée (copie ${h(sav.idCopie)}, partie ${h(sav.partie)}).<br><button class="btn" id="btnresume" style="margin-top:8px">Reprendre la copie en cours</button></div>`;
      $('#btnresume', w).onclick = () => { E = sav; w.remove(); dernierTick = Date.now(); afficherPartie(); };
      $('#codeok', w).disabled = true;
      return;
    }
    E = nouvelleCopie(variante); sauver();
    w.remove(); dernierTick = Date.now(); afficherPartie();
  };
  $('#codeok', w).onclick = go;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  inp.addEventListener('input', () => { $('#codeok', w).disabled = false; $('#resume', w).innerHTML = ''; err.textContent = ''; });
}

/* Adresse ou lien affiché sur une carte 1A (pour l'export) */
function adresseCarte(c) {
  if (c.type === 'recherche') return c.adresse;
  if (c.type === 'flyer') return c.lien;
  const m = String(c.texte).match(/[a-z0-9.-]+\.[a-z]{2,}(\/[\w-]*)?/i);
  return m ? m[0] : '';
}

/* Souligne les adresses dans un texte (non cliquables) */
function soulignerLiens(t) { return h(t).replace(/((?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:fr|com|net|info|ly|gouv\.fr)(?:\/[\w-]+)?)/gi, '<u>$1</u>'); }

function maquette(c) {
  const sbar = `<div class="sbar"><span>${h(c.heure || '14:27')}</span><span>📶 4G ▮▮▮</span></div>`;
  switch (c.type) {
    case 'recherche':
      return `<div class="mk-search"><div class="bar"><span class="lg">${h(nom('trouvo'))}</span><span class="q">${h(c.requete || '')}</span><span>🔍</span></div><div class="r">
        ${c.sponsorise ? '<div class="spons">Sponsorisé</div>' : ''}
        <div class="site"><span class="f" style="background:${c.couleur}">${h(c.favicon)}</span><span><span class="nm">${h(c.nomSite)}</span><br><span class="u">https://${h(c.adresse)}</span></span></div>
        <h3>${h(c.titre)}</h3><p>${h(c.texte)}</p></div></div>`;
    case 'sms':
      return `<div class="mk-phone"><div class="scr">${sbar}<div class="who"><div class="av">👤</div>${h(c.expediteur)}</div>
        <div class="tm">Aujourd'hui ${h(c.heure)}</div><div class="bub">${soulignerLiens(c.texte)}</div></div></div>`;
    case 'reseau':
      return `<div class="mk-post"><div class="grp">👥 Publication dans le groupe <b>${h(c.groupe)}</b></div>
        <div class="hd"><span class="av">${h(c.auteur[0])}</span><span><b>${h(c.auteur)}</b><small>${h(c.quand)} · 🌐</small></span></div>
        <div class="tx">${soulignerLiens(c.texte)}</div><div class="ft"><span>👍 ❤️ ${h(c.reactions)}</span></div></div>`;
    case 'story':
      return `<div class="mk-phone mk-story"><div class="scr"><div class="prog"><i></i></div>
        <div class="acc"><span class="av">B</span><span>${h(c.compte)} <small>${h(c.quand)}</small></span></div>
        <div class="big">${h(c.texte.split('👉')[0])}</div><div class="lnk">🔗 ${h((c.texte.split('👉')[1] || '').trim())}</div></div></div>`;
    case 'ia':
      return `<div class="mk-ia"><div class="hd"><i></i>Assistant IA</div><div class="u">${h(c.question)}</div>
        <div class="a"><i></i><span>${h(c.texte)}</span></div></div>`;
    case 'flyer':
      return `<div class="mk-flyer"><div style="font-size:11px;color:#777;margin-bottom:6px">Papier trouvé dans la boîte aux lettres</div><h4>${h(c.titre)}</h4><p>${h(c.texte)}</p><div class="qr"></div><div class="lnk">${h(c.lien)}</div></div>`;
  }
  return '';
}

/* Lettre et couleur d'une proposition : fixées par l'ordre de départ (tiré au hasard), elles ne bougent pas pendant le classement */
function lettre2A(id) { return String.fromCharCode(65 + E.ordres['2A'].indexOf(id)); }
function couleur2A(id) { const c = CONFIG.couleursLettres2A; return c[E.ordres['2A'].indexOf(id) % c.length]; }

RENDUS['2A'] = main => {
  const R = E.reponses['2A'], n = CONFIG.motsDePasse.length;
  if (!R.classement) R.classement = E.ordres['2A'].slice();
  main.innerHTML = `<div class="page"><h1>Gérer ses mots de passe</h1>
    <div class="consigne">Voici ${n} façons de gérer ses mots de passe. <b>Rangez-les de la meilleure (en haut) à la pire (en bas).</b><br>
      Pour déplacer une étiquette : <b>cliquez dessus, gardez le bouton appuyé, faites-la glisser</b> à sa place, puis relâchez.</div>
    <div class="rank2"><div class="axe"><span class="top">▲<br>La meilleure</span><span class="mid">⋮</span><span class="bot">La pire<br>▼</span></div><ol class="rank" id="rank"></ol></div>
    <label class="q" style="margin-top:20px">Pourquoi utiliser le même mot de passe partout est-il dangereux ?</label><textarea rows="3" id="j2a"></textarea></div>`;
  const ol = $('#rank', main);
  const draw = moved => {
    ol.innerHTML = R.classement.map(id => { const c = couleur2A(id);
      return `<li data-id="${id}" class="${id === moved ? 'moved' : ''}" style="border-left-color:${c}"><span class="grip" aria-hidden="true">⋮⋮</span>
        <span class="lt" style="background:${c}">${lettre2A(id)}</span><span>${h(CONFIG.motsDePasse.find(m => m.id === id).texte)}</span></li>`; }).join('');
  };
  /* Glisser-déposer à la souris (événements pointer : marche aussi au doigt et au stylet) */
  let drag = null;
  ol.addEventListener('pointerdown', e => {
    const li = e.target.closest('li'); if (!li || e.button > 0) return;
    e.preventDefault();
    ol.setPointerCapture(e.pointerId);
    drag = { li, decalage: e.clientY - li.getBoundingClientRect().top, avant: R.classement.join() };
    li.classList.add('dragging');
  });
  ol.addEventListener('pointermove', e => {
    if (!drag) return;
    const li = drag.li, autres = $$('li', ol).filter(x => x !== li);
    let i = autres.findIndex(x => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    const ref = i < 0 ? null : autres[i];
    if (li.nextElementSibling !== ref) ol.insertBefore(li, ref);
    li.style.transform = '';
    li.style.transform = `translateY(${e.clientY - drag.decalage - li.getBoundingClientRect().top}px)`;
  });
  const lacher = () => {
    if (!drag) return;
    const li = drag.li; li.style.transform = ''; li.classList.remove('dragging');
    R.classement = $$('li', ol).map(x => x.dataset.id);
    if (R.classement.join() !== drag.avant) { R.modifie = true; sauver(); draw(li.dataset.id); }
    drag = null;
  };
  ol.addEventListener('pointerup', lacher);
  ol.addEventListener('pointercancel', lacher);
  draw();
  lier($('#j2a', main), () => R.justification, x => R.justification = x);
  footbar('', null, () => (R.justification.trim() ? 0 : 1) + (R.modifie ? 0 : 1));
};

/* Remet les minuteurs en route (début, ou reprise après rechargement) */
function reprendreSim() {
  clearSimTimers();
  const s = S(), f = s.f, ph = s.ph;
  ph.pin = null; ph.web = ph.web || null;
  if (ph.call && ph.call.etape !== 'fin') { ph.call.etape = 'ring'; programmerSonnerieMax(); }
  if (ph.call && ph.call.etape === 'fin') ph.call = null;
  if (f.pirate.programmee && !f.pirate.envoyee) later(envoyerPirate, SC.delaiDemandePirate);
  if (f.depot && !ph.call) programmerIncidentSuivant();
  const u = parse(s.url);
  if (u.host === IP && u.path === '/plus/consentement' && !f.authOk) s.url = IP + '/plus?service=habitatadapt';
}

/* ---------- Clics ---------- */
function onSimClick(e) {
  const lg = e.target.closest('[data-log]');

    const [cible, cat] = lg.dataset.log.split('|');

    journalClic(zone, cible, cat);
  }
  const go = e.target.closest('[data-go]');
  if (go) { navigate(go.dataset.go); return; }
  const act = e.target.closest('[data-act]');
  if (act && ACTIONS[act.dataset.act]) ACTIONS[act.dataset.act](act);
}

/* ---------- Fin de la démarche ---------- */
async function terminerDemarche() {
  const s = S(), f = s.f, ph = s.ph;
  if (ph.call && ph.call.etape !== 'fin') { toast(ph.call.etape === 'ring' ? 'Votre téléphone sonne.' : 'Vous êtes au téléphone.'); return; }
  if (f.depot && f.incidents.index < V().sim.ordreIncidents.length) {
    clearSimTimers(); if (f.pirate.programmee && !f.pirate.envoyee) envoyerPirate(); demarrerIncident(); toast('Votre téléphone vibre.'); return;
  }
  if (!await confirmer('Terminer la démarche ?', '<p>Vous allez passer aux questions de fin.</p><p><b>Vous ne pourrez plus revenir dans le simulateur.</b></p>', 'Passer aux questions', 'Revenir au simulateur')) return;
  f.finDemarche = { t: hhmmss(s.tAcc), demandeDeposee: f.depot };
  if (f.pirate.envoyee && !f.pirate.etat) journal('telephone', 'demande-pirate-ignoree', 'evenement', 'aucune réponse à la demande ' + nom(V().sim.servicePirate));

function parse(url) {
  const [hp, q = ''] = url.split('?'); const i = hp.indexOf('/');
  const host = i < 0 ? hp : hp.slice(0, i), path = i < 0 ? '/' : hp.slice(i) || '/';
  const params = {}; q.split('&').filter(Boolean).forEach(kv => { const [k, v = ''] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v); });
  return { host, path, params };
}
function navigate(url, replace) {
  const s = S();
  if (replace) s.hist[s.histIdx] = url;
  else { s.hist = s.hist.slice(0, s.histIdx + 1); s.hist.push(url); s.histIdx = s.hist.length - 1; }
  s.url = url; sauver(); renderBrowser(true);
}
function renderBrowser(anim) {
  const s = S(); const u = parse(s.url);
  const site = SITES[u.host];
  const pg = site ? site(u) : { title: 'Page inaccessible', fav: ['#999', '!'], cls: '', html: '<div class="neutralpage"><h2>Ce site est inaccessible</h2></div>' };
  if (pg.redirect) { s.url = pg.redirect; s.hist[s.histIdx] = pg.redirect; return renderBrowser(anim); }
  $('#tabttl').textContent = pg.title; const fv = $('#tabfav'); fv.style.background = pg.fav[0]; fv.innerHTML = pg.fav[1];
  const shown = s.url.split('?')[0]; const i = shown.indexOf('/');
  $('#urlbar').innerHTML = `<span class="host">${h(i < 0 ? shown : shown.slice(0, i))}</span><span class="rest">${h(i < 0 ? '' : shown.slice(i))}</span>`;
  const vp = $('#viewport'); vp.innerHTML = `<div class="pg ${pg.cls || ''}">${pg.html}</div>`; vp.scrollTop = 0;
  $('#btnback').disabled = s.histIdx <= 0; $('#btnfwd').disabled = s.histIdx >= s.hist.length - 1;
  if (pg.after) pg.after();
  if (anim) { const lb = $('#loadingbar'); lb.style.transition = 'none'; lb.style.width = '0'; requestAnimationFrame(() => { lb.style.transition = 'width .35s ease-out'; lb.style.width = '100%'; setTimeout(() => { lb.style.width = '0'; lb.style.transition = 'none'; }, 420); }); }
  sauver();
}

/* =====================================================================
   TÉLÉPHONE

function heurePhone(off = 0) {
  const [hh, mm] = SC.heureDepart.split(':').map(Number);
  const m = hh * 60 + mm + Math.floor(((E.sim ? E.sim.tAcc : 0) + off) / 60);
  return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function majHorloge() { $$('.ph-clock').forEach(x => x.textContent = heurePhone()); }

function notifier(app, titre, texte, extra = {}) {
  const ph = S().ph; ph.nid++;
  const n = Object.assign({ id: 'n' + ph.nid, app, titre, texte, heure: heurePhone(), lu: false }, extra);
  ph.notifs.push(n); sauver(); renderPhone(); showBanner(n);
}
function showBanner(n) {
  const scr = $('#phscr'); if (!scr) return;
  hideBanner();
  const b = document.createElement('div'); b.className = 'ph-banner'; b.id = 'phbanner';
  b.dataset.act = 'phNotif'; b.dataset.id = n.id; b.dataset.log = `notification-${n.cible || n.app}|neutre`;
  b.innerHTML = `<b>${h(n.titre)} · maintenant</b>${h(n.texte)}`;
  scr.appendChild(b);
  bannerTimer = setTimeout(hideBanner, 6000);
}
function hideBanner() { clearTimeout(bannerTimer); const b = $('#phbanner'); if (b) b.remove(); }

function recevoirSms(de, texte, extra = {}) {
  const ph = S().ph;
  ph.sms.push(Object.assign({ de, texte, heure: heurePhone(), lu: false }, extra));
  notifier('messages', 'Messages — ' + de, texte, { de, cible: extra.cible || 'sms' });
}

/* ---------- NumérID : demandes de connexion ---------- */
function nouvelleDemandeNumerid(legit) {
  const ph = S().ph; ph.nid++;
  /* service et via : clés de services.js */
  const r = legit ? { id: 'r' + ph.nid, legit: true, service: 'habitatAdapt', via: 'identipassPlus', etat: 'attente' }
    : { id: 'r' + ph.nid, legit: false, service: V().sim.servicePirate, via: 'identipass', etat: 'attente' };
  ph.reqs.push(r);
  journal('telephone', legit ? 'demande-numerid-habitatadapt' : 'demande-pirate-' + r.service, 'evenement', 'notification reçue');
  notifier('numerid', nom('numerid'), `Demande de connexion à ${nom(r.service)} via ${nom(r.via)}. Est-ce bien vous ?`, { cible: legit ? 'numerid' : 'numerid-pirate' });
}
function envoyerPirate() {
  const f = F(); if (f.pirate.envoyee) return;
  f.pirate.envoyee = true; nouvelleDemandeNumerid(false);
}
function demarrerPin(id) {
  const ph = S().ph, r = ph.reqs.find(x => x.id === id); if (!r || r.etat !== 'attente') return;
  if (ph.bloqueJusqua && S().tAcc < ph.bloqueJusqua) { renderPhone(); return; }
  if (!r.legit) { const f = F(); f.pirate.etat = 'confirmee'; f.pirate.confirmeeAuMoinsUneFois = true; journal('telephone', 'demande-pirate-confirmee', 'evenement'); }
  ph.pin = { id, saisie: '' }; renderPhone();
}
function saisirPin(k) {
  const s = S(), ph = s.ph; if (!ph.pin) return;
  if (ph.bloqueJusqua && s.tAcc < ph.bloqueJusqua) return;
  if (k === '⌫') ph.pin.saisie = ph.pin.saisie.slice(0, -1);
  else if (/\d/.test(k) && ph.pin.saisie.length < 6) ph.pin.saisie += k;
  ph.pin.err = '';
  if (ph.pin.saisie.length === 6) {
    const r = ph.reqs.find(x => x.id === ph.pin.id);
    if (ph.pin.saisie === P.numerid.codeSecret) {
      ph.pin = null; ph.essaisFaux = 0;
      if (r) repondreReq(r.id, 'confirmee', true); return;
    }
    const f = F(); f.codesFaux++; ph.essaisFaux++;
    journal('telephone', 'code-numerid-faux', 'piege');
    s.cpt.piege++;
    ph.pin.saisie = '';
    if (ph.essaisFaux >= SC.essaisCodeAvantBlocage) {
      ph.essaisFaux = 0; ph.bloqueJusqua = s.tAcc + SC.dureeBlocageNumerid; f.blocagesNumerid++;
      journal('telephone', 'numerid-bloquee', 'evenement', `${SC.dureeBlocageNumerid} s`);
      ph.pin = null;
    } else ph.pin.err = 'Échec de la vérification.';
  }
  renderPhone();
}
function repondreReq(id, etat, avecCode) {
  const s = S(), f = s.f, ph = s.ph, r = ph.reqs.find(x => x.id === id); if (!r || r.etat !== 'attente') return;
  r.etat = etat; r.t = hhmmss(s.tAcc);
  if (r.legit) {
    journal('telephone', 'numerid-habitatadapt-' + etat, 'evenement');
    if (etat === 'confirmee') { f.authOk = true; navigate(IP + '/plus/consentement?service=habitatadapt'); }
    else navigate(IP + '/plus?service=habitatadapt&msg=refus');
  } else {
    if (etat === 'refusee') { f.pirate.etat = 'refusee'; journal('telephone', 'demande-pirate-refusee', 'evenement'); }
    if (etat === 'confirmee' && avecCode) { f.pirate.codeSaisi = true; journal('telephone', 'demande-pirate-code-saisi', 'evenement'); }
  }
  ph.notifs.filter(n => n.app === 'numerid').forEach(n => n.lu = true);
  sauver(); renderPhone();
}

/* ---------- Incidents après le dépôt ---------- */
function programmerIncidentSuivant() {
  const f = F(); if (f.incidents.index >= V().sim.ordreIncidents.length) return;
  later(demarrerIncident, f.incidents.index === 0 ? SC.delaiPremierIncident : SC.delaiEntreIncidents);
}
function demarrerIncident() {
  const f = F(), k = V().sim.ordreIncidents[f.incidents.index]; if (!k) return;
  f.incidents.index++;
  if (k === 'appel') { lancerAppel(); return; }
  /* SMS de frais */
  const sf = V().sim.smsFrais; f.incidents.smsFrais.recu = true;
  journal('telephone', 'sms-frais-recu', 'evenement');
  recevoirSms(sf.expediteur, `${nom('habitatAdapt')} : des frais de traitement de ${sf.montant} sont nécessaires pour valider votre dossier : ${sf.domaine}`, { lien: sf.domaine, cible: 'sms-frais' });
  later(programmerIncidentSuivant, 10);
}
function lancerAppel() {
  const ph = S().ph;
  ph.call = { etape: 'ring', numero: '02 61 91 08 43' };
  journal('telephone', 'appel-entrant', 'evenement', 'appel ' + (F().incidents.appelRefus ? 'renouvelé' : 'reçu'));
  hideBanner(); renderPhone(); programmerSonnerieMax();
}
function programmerSonnerieMax() { later(() => { const ph = S().ph; if (ph.call && ph.call.etape === 'ring') { journal('telephone', 'appel-sans-reponse', 'evenement'); refuserAppel(true); } }, 25); }
function decrocher() {
  const ph = S().ph; if (!ph.call) return;
  ph.call.etape = 'talk'; renderPhone();
  later(() => {
    const f = F(); if (f.incidents.smsCodeRecu) { if (S().ph.call) { S().ph.call.choix = true; renderPhone(); } return; } f.incidents.smsCodeRecu = true;
    recevoirSms(nom('habitatAdapt'), nom('habitatAdapt') + ' : votre code de confirmation est 472915. Ne le communiquez à personne.', { cible: 'sms-code' });
    if (S().ph.call) { S().ph.call.choix = true; renderPhone(); }
  }, SC.delaiSmsApresAppel);
}
function refuserAppel(sansReponse) {
  const f = F(), ph = S().ph; f.incidents.appelRefus++;
  if (f.incidents.appelRefus >= 2) { f.incidents.appel = sansReponse ? 'sans-reponse' : 'refuse'; ph.appels.push({ numero: ph.call.numero, heure: heurePhone(), type: 'manqué' }); ph.call = null; renderPhone(); programmerIncidentSuivant(); return; }
  ph.appels.push({ numero: ph.call.numero, heure: heurePhone(), type: 'manqué' }); ph.call = null; renderPhone();
  later(lancerAppel, SC.delaiRappelSiRefus);
}
function finAppel(choix) {
  const f = F(), ph = S().ph; if (!ph.call) return;
  f.incidents.appel = choix;
  journal('telephone', 'appel-' + choix, 'evenement');
  const rep = { 'code-lu': '« Parfait, merci madame. Votre dossier est finalisé. Bonne journée. »', 'raccroche': '', 'rappel-plus-tard': '« Euh… Monsieur Martin, service des dossiers. Faites vite, sinon votre dossier sera annulé. »' }[choix];
  ph.call.etape = 'fin'; ph.call.rep = rep; ph.appels.push({ numero: ph.call.numero, heure: heurePhone(), type: 'reçu' });
  renderPhone();
  later(() => { S().ph.call = null; renderPhone(); programmerIncidentSuivant(); }, rep ? 4 : 1.5);
}

      <div class="ring"><div><span style="background:#e53935" data-act="appelRefuser" ${L('appel-refuser', 'neutre')}>✆</span><small>Refuser</small></div><div><span style="background:#34a853" data-act="appelDecrocher" ${L('appel-decrocher', 'neutre')}>✆</span><small>Décrocher</small></div></div></div>`;
    else if (c.etape === 'talk') over += `<div class="call"><div class="sub">En communication</div><div class="who" style="font-size:16px">${c.numero}</div>
      <div class="tr">« Bonjour, conseiller ${esc(nom('habitatAdapt'))}. Pour finaliser votre dossier, je vous envoie un code par SMS, il faut me le lire. »</div>
      ${c.choix ? `<div class="acts"><span data-act="appelChoix" data-c="code-lu" ${L('appel-lire-le-code', 'piege')}>Lire le code au conseiller</span><span data-act="appelChoix" data-c="raccroche" ${L('appel-raccrocher', 'utile')}>Raccrocher</span><span data-act="appelChoix" data-c="rappel-plus-tard" ${L('appel-demander-nom-rappeler', 'utile')}>Lui demander son nom et le rappeler plus tard</span></div>` : '<div class="sub" style="margin-top:auto">…</div>'}</div>`;
    else over += `<div class="call"><div class="sub">Appel terminé</div><div class="who" style="font-size:16px">${c.numero}</div>${c.rep ? `<div class="tr">${c.rep}</div>` : ''}</div>`;
  }
  const keepBanner = $('#phbanner');
  scr.innerHTML = sbar + `<div class="content">${body}</div>${over}<div class="homebar"><i data-act="phHome" ${L('telephone-bouton-accueil', 'neutre')}></i></div>`;
  if (keepBanner) scr.appendChild(keepBanner);
  sauver();
}

</script>
</body>
</html>
