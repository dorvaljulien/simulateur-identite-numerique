<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur Identité numérique</title>
<style>
/* ============ COQUE DU SIMULATEUR ============ */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; color: #222; background: #d9dce1; overflow: hidden; }
button { font-family: inherit; }
.hidden { display: none !important; }

#app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 34px 1fr; height: 100vh; min-height: 600px; }

/* --- Bandeau supérieur --- */
#topbar { display: flex; align-items: center; gap: 12px; padding: 0 10px; background: #33363b; color: #c9ccd1; font-size: 12px; white-space: nowrap; }
#topbar .simlabel { opacity: .75; letter-spacing: .02em; cursor: default; user-select: none; }
#topbar .mission { flex: 1; overflow: hidden; text-overflow: ellipsis; color: #fff; font-size: 13px; padding-left: 12px; border-left: 1px solid #555; }
#topbar .mission b { color: #ffd479; font-weight: 600; margin-right: 6px; }
#topbar .codebox { display: flex; align-items: center; gap: 4px; opacity: .8; }
#topbar .codebox input { width: 46px; height: 22px; border: 1px solid #555; background: #222; color: #fff; text-align: center; font-size: 13px; letter-spacing: 3px; border-radius: 3px; }
#topbar .codebox button { height: 22px; border: 1px solid #555; background: #444; color: #ddd; border-radius: 3px; font-size: 11px; cursor: pointer; }
#topbar .codebox.err input { border-color: #e66; animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

#main { display: grid; grid-template-columns: minmax(0, 1fr) 350px; min-height: 0; }
#main.mailwide { grid-template-columns: minmax(0, 1fr) 600px; }

/* --- Navigateur fictif --- */
#browser { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fff; border-right: 1px solid #aaa; position: relative; }
#tabstrip { display: flex; align-items: flex-end; height: 34px; background: #dee1e6; padding: 0 6px; gap: 2px; flex-shrink: 0; }
.btab { display: flex; align-items: center; gap: 7px; height: 28px; max-width: 220px; min-width: 60px; flex: 1 1 200px; padding: 0 8px 0 10px; border-radius: 8px 8px 0 0; font-size: 12px; color: #3c4043; cursor: default; position: relative; }
.btab:hover { background: #eceef1; }
.btab.active { background: #fff; }
.btab .fav { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; }
.btab .ttl { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.btab .x { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #555; cursor: pointer; }
.btab .x:hover { background: #ccc; }
#newtabbtn { width: 28px; height: 28px; border: 0; background: transparent; font-size: 18px; color: #555; cursor: pointer; border-radius: 50%; margin-bottom: 1px; }
#newtabbtn:hover { background: #cfd2d7; }

#toolbar { display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px; background: #fff; border-bottom: 1px solid #dadce0; flex-shrink: 0; position: relative; }
.tbtn { width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: #5f6368; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tbtn:hover { background: #f1f3f4; }
.tbtn:disabled { color: #c4c6c9; background: transparent; cursor: default; }
#omnibox { flex: 1; display: flex; align-items: center; height: 30px; background: #f1f3f4; border-radius: 15px; padding: 0 6px 0 10px; gap: 6px; border: 2px solid transparent; }
#omnibox:focus-within { background: #fff; border-color: #8ab4f8; }
#omnibox .secure { font-size: 12px; color: #5f6368; display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: default; }
#omnibox .secure.bad { color: #c5221f; font-weight: 600; }
#urlinput { flex: 1; border: 0; background: transparent; font-size: 14px; outline: none; color: #202124; min-width: 0; }
#omnibox .omni-ic { color: #5f6368; font-size: 14px; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
#omnibox .omni-ic:hover { background: #e3e5e8; }
#bmbar { display: flex; gap: 2px; height: 28px; align-items: center; padding: 0 10px; border-bottom: 1px solid #dadce0; font-size: 12px; background: #fff; flex-shrink: 0; }
#bmbar span { padding: 3px 8px; border-radius: 12px; cursor: pointer; color: #3c4043; display: flex; align-items: center; gap: 6px; }
#bmbar span:hover { background: #f1f3f4; }
#bmbar i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

#viewport { flex: 1; overflow: auto; position: relative; min-height: 0; background: #fff; }
#viewport .page { min-height: 100%; position: relative; }
#loadingbar { position: absolute; left: 0; top: 0; height: 2px; background: #1a73e8; width: 0; z-index: 5; transition: width .35s ease-out; }

/* Pop-up « Enregistrer le mot de passe ? » */
#pwdprompt { position: absolute; right: 14px; top: 76px; width: 340px; background: #fff; border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.28); padding: 18px 18px 14px; z-index: 40; font-size: 13px; }
#pwdprompt h4 { margin: 0 0 12px; font-size: 15px; font-weight: 500; color: #202124; }
#pwdprompt .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
#pwdprompt .row label { width: 110px; color: #5f6368; font-size: 12px; }
#pwdprompt .row input { flex: 1; border: 0; border-bottom: 1px solid #dadce0; padding: 5px 2px; font-size: 13px; background: #f8f9fa; }
#pwdprompt .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#pwdprompt .btns button { padding: 7px 18px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid #dadce0; background: #fff; color: #1a73e8; }
#pwdprompt .btns button.prim { background: #1a73e8; color: #fff; border-color: #1a73e8; }
#pwdprompt .note { font-size: 11px; color: #5f6368; margin-top: 4px; }

/* Masque « étape terminée » */
.gate { position: absolute; inset: 0; background: rgba(40,42,46,.82); z-index: 60; display: flex; align-items: center; justify-content: center; }
.gate .box { background: #fff; border-radius: 10px; padding: 30px 36px; max-width: 460px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
.gate .box h2 { margin: 0 0 10px; font-size: 22px; color: #1b5e20; }
.gate .box p { margin: 8px 0; line-height: 1.5; color: #333; }
.gate .box .arrow { font-size: 13px; color: #777; margin-top: 16px; }

/* Cartouche « En vrai » (couleur volontairement étrangère aux sites) */
.envrai { background: #fff7c2; border: 2px dashed #8a6d00; color: #3d3000; border-radius: 6px; padding: 8px 12px 8px 10px; font-size: 12.5px; line-height: 1.4; font-family: "Segoe UI", Arial, sans-serif; box-shadow: 2px 3px 0 rgba(0,0,0,.12); }
.envrai::before { content: "EN VRAI"; display: inline-block; background: #8a6d00; color: #fff7c2; font-weight: 700; font-size: 10px; letter-spacing: .08em; padding: 1px 6px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }
#envraifloat { position: absolute; left: 18px; bottom: 16px; max-width: 330px; z-index: 30; padding-right: 26px; }
#envraifloat .close { position: absolute; right: 6px; top: 4px; cursor: pointer; font-weight: 700; color: #8a6d00; }

/* --- Colonne latérale --- */
#side { display: flex; flex-direction: column; min-height: 0; background: #e8eaed; }

/* MaBoîte */
#mail { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #fff; font-family: "Segoe UI", Arial, sans-serif; }
#mail .mhead { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; background: #3b5b8c; color: #fff; flex-shrink: 0; }
#mail .mhead .logo { font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
#mail .mhead .logo span { color: #ffcf6e; }
#mail .mhead .sp { flex: 1; }
#mail .mhead .mi { cursor: pointer; padding: 3px 7px; border-radius: 4px; font-size: 14px; opacity: .9; }
#mail .mhead .mi:hover { background: rgba(255,255,255,.15); }
#mail .mhead .who { font-size: 11px; opacity: .8; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#mail .mfolders { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid #dde1e7; flex-shrink: 0; background: #f4f6f9; font-size: 12px; }
#mail .mfolders span { padding: 5px 9px; border-radius: 5px 5px 0 0; cursor: pointer; color: #444; white-space: nowrap; }
#mail .mfolders span.on { background: #fff; color: #1d3b66; font-weight: 600; border: 1px solid #dde1e7; border-bottom-color: #fff; margin-bottom: -1px; }
#mail .mfolders .cnt { background: #3b5b8c; color: #fff; border-radius: 8px; padding: 0 5px; font-size: 10px; margin-left: 3px; }
#mail .mfolders .cnt.spam { background: #b45309; }
#mail .msearch { padding: 6px 8px; border-bottom: 1px solid #eef0f3; flex-shrink: 0; }
#mail .msearch input { width: 100%; height: 26px; border: 1px solid #d6dae0; border-radius: 13px; padding: 0 10px; font-size: 12px; background: #f7f8fa; }
#mail .mbody { flex: 1; overflow: auto; min-height: 0; }
.mrow { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; padding: 7px 10px 7px 12px; border-bottom: 1px solid #eef0f3; cursor: pointer; font-size: 12.5px; position: relative; }
.mrow:hover { background: #f3f6fb; }
.mrow .from { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #333; }
.mrow .time { font-size: 11px; color: #777; }
.mrow .subj { grid-column: 1 / 3; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #555; font-size: 12px; }
.mrow.unread { background: #f7faff; }
.mrow.unread::before { content: ""; position: absolute; left: 3px; top: 12px; width: 6px; height: 6px; border-radius: 50%; background: #3b5b8c; }
.mrow.unread .from, .mrow.unread .subj { font-weight: 700; color: #111; }
.mrow.new { animation: flashrow 1.6s; }
@keyframes flashrow { from { background: #fff1c7; } to { background: #f7faff; } }
.mempty { padding: 30px 16px; text-align: center; color: #888; font-size: 12.5px; }
.mspamnote { background: #fff4e5; color: #7a4a00; font-size: 11.5px; padding: 6px 10px; border-bottom: 1px solid #f3dfbf; }
.mread { padding: 0 0 16px; font-size: 13px; }
.mread .mrtools { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #eef0f3; position: sticky; top: 0; background: #fff; font-size: 12px; }
.mread .mrtools span { cursor: pointer; padding: 3px 8px; border-radius: 4px; color: #1d3b66; }
.mread .mrtools span:hover { background: #eef2f8; }
.mread h3 { margin: 12px 12px 8px; font-size: 16px; font-weight: 600; color: #111; line-height: 1.3; }
.mread .mmeta { display: grid; grid-template-columns: 34px 1fr; gap: 0 9px; margin: 0 12px 12px; font-size: 12px; color: #555; }
.mread .mmeta .av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; grid-row: 1 / 3; font-size: 14px; }
.mread .mmeta b { color: #222; }
.mread .mcontent { margin: 0 12px; line-height: 1.5; color: #222; overflow-wrap: anywhere; }
.mread .mcontent a, .mread .mcontent .mlink { color: #1a5bb5; text-decoration: underline; cursor: pointer; }
.mread .spamwarn { margin: 0 12px 10px; padding: 7px 9px; background: #fff4e5; border: 1px solid #f3cf99; border-radius: 4px; font-size: 11.5px; color: #7a4a00; }

/* Paramètres MaBoîte / connexion MaBoîte */
.mset { padding: 12px 14px; font-size: 13px; }
.mset h3 { margin: 4px 0 10px; font-size: 16px; }
.mset .crumbs { font-size: 11px; color: #777; margin-bottom: 8px; }
.mset .menu div { padding: 9px 10px; border: 1px solid #e2e5ea; border-radius: 5px; margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; }
.mset .menu div:hover { background: #f3f6fb; }
.mset .sec { border: 1px solid #e2e5ea; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
.mset .sec h4 { margin: 0 0 4px; font-size: 13px; }
.mset .sec p { margin: 3px 0; color: #555; font-size: 12px; line-height: 1.4; }
.mbtn { background: #3b5b8c; color: #fff; border: 0; border-radius: 4px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; }
.mbtn.ghost { background: #fff; color: #3b5b8c; border: 1px solid #3b5b8c; }
.mlogin { padding: 26px 22px; }
.mlogin h3 { margin: 0 0 4px; font-size: 18px; color: #1d3b66; }
.mlogin p { color: #666; font-size: 12px; margin: 0 0 14px; }
.mlogin label { display: block; font-size: 12px; color: #444; margin: 10px 0 3px; }
.mlogin input { width: 100%; height: 32px; border: 1px solid #c7ccd4; border-radius: 4px; padding: 0 8px; font-size: 13px; }
.mlogin .err { color: #b3261e; font-size: 12px; margin-top: 8px; }
.mlogin .or { text-align: center; color: #999; font-size: 11px; margin: 14px 0; }

/* Bureau : téléphone + objets */
#desk { height: 222px; flex-shrink: 0; display: flex; gap: 12px; padding: 10px 12px; background: linear-gradient(#cdb89a, #bba483); border-top: 1px solid #9c8566; }
#phone { width: 118px; height: 202px; background: #16171a; border-radius: 18px; padding: 7px; box-shadow: 0 3px 8px rgba(0,0,0,.35); flex-shrink: 0; cursor: pointer; position: relative; }
#phone .scr { width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: linear-gradient(160deg, #3c4f74, #1d2538 60%, #3a2b45); color: #fff; position: relative; font-size: 10px; }
#phone .sbar { display: flex; justify-content: space-between; padding: 4px 9px 0; font-size: 9px; opacity: .85; }
#phone .big { text-align: center; font-size: 32px; font-weight: 300; margin-top: 10px; letter-spacing: -.02em; }
#phone .date { text-align: center; font-size: 10px; opacity: .85; margin-bottom: 8px; }
#phone .notif { margin: 0 6px 4px; background: rgba(255,255,255,.18); border-radius: 7px; padding: 4px 6px; font-size: 8.5px; line-height: 1.25; }
#phone .notif b { display: block; font-size: 8px; opacity: .8; font-weight: 600; }
#phone .notif.fresh { background: rgba(255,255,255,.32); }
#phone .pinpad { position: absolute; inset: 0; background: rgba(12,14,20,.94); display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
#phone .pinpad .t { font-size: 9px; text-align: center; padding: 0 8px; line-height: 1.3; min-height: 34px; }
#phone .pinpad .dots { display: flex; gap: 6px; margin: 6px 0 8px; }
#phone .pinpad .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #fff; }
#phone .pinpad .dots i.f { background: #fff; }
#phone .pinpad .keys { display: grid; grid-template-columns: repeat(3, 30px); gap: 5px; }
#phone .pinpad .keys span { width: 30px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; user-select: none; }
#phone .pinpad .keys span:active { background: rgba(255,255,255,.4); }
#phone .pinpad .err { color: #ff9b9b; font-size: 9px; height: 12px; }
#phone .badge { position: absolute; top: -5px; right: -5px; background: #e53935; color: #fff; border-radius: 10px; font-size: 10px; padding: 1px 6px; font-weight: 700; }

#deskitems { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.deskbtn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; cursor: pointer; border: 0; text-align: left; box-shadow: 0 3px 6px rgba(0,0,0,.25); font-size: 13px; font-weight: 600; transition: transform .1s; }
.deskbtn:hover { transform: translateY(-2px); }
.deskbtn .ic { font-size: 26px; }
.deskbtn small { display: block; font-weight: 400; font-size: 11px; opacity: .75; }
#btnpapiers { background: #e9b949; color: #4a3500; }
#btncarte { background: #f6f1e7; color: #3a3326; }
.deskclock { font-size: 11px; color: #3e2f18; text-align: center; background: rgba(255,255,255,.35); border-radius: 4px; padding: 4px; }

/* --- Fenêtres modales --- */
.overlay { position: fixed; inset: 0; background: rgba(25,27,31,.6); z-index: 100; display: flex; align-items: center; justify-content: center; }
.modal { background: #fff; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.4); max-width: 94vw; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
.modal .mh { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid #e3e3e3; background: #f7f7f5; }
.modal .mh h2 { flex: 1; margin: 0; font-size: 16px; }
.modal .mh .close { cursor: pointer; font-size: 20px; color: #666; padding: 0 6px; }
.modal .mb { overflow: auto; padding: 16px; }

/* Trieur de papiers */
.trieur { width: 1060px; height: 88vh; }
.trieur .mb { padding: 0; display: grid; grid-template-columns: 250px 1fr; height: 100%; min-height: 0; }
.trieur .pochettes { background: #efe7d6; padding: 14px 10px; overflow: auto; border-right: 1px solid #d8ccb2; }
.pochette { margin-bottom: 12px; }
.pochette .ong { display: inline-block; padding: 4px 14px; border-radius: 6px 6px 0 0; font-size: 12px; font-weight: 700; cursor: pointer; }
.pochette .contenu { border-radius: 0 6px 6px 6px; padding: 6px; min-height: 30px; }
.pochette .doc { background: #fff; border: 1px solid rgba(0,0,0,.12); border-radius: 3px; padding: 6px 8px; margin-bottom: 5px; font-size: 12px; cursor: pointer; display: flex; gap: 6px; align-items: center; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.pochette .doc:hover { border-color: #555; }
.pochette .doc.on { outline: 2px solid #2a6; }
.pochette .doc .pg { font-size: 15px; }
.pochette.closed .contenu { display: none; }
.p-banque .ong, .p-banque .contenu { background: #9ec5e8; }
.p-sante .ong, .p-sante .contenu { background: #a8d8b0; }
.p-impots .ong, .p-impots .contenu { background: #f2b5a0; }
.p-divers .ong, .p-divers .contenu { background: #d6c3e8; }
.trieur .lecteur { display: flex; flex-direction: column; min-height: 0; background: #7d7f83; }
.trieur .ltools { display: flex; gap: 8px; align-items: center; padding: 6px 12px; background: #5f6165; color: #fff; font-size: 12px; }
.trieur .ltools button { background: #44464a; color: #fff; border: 1px solid #333; border-radius: 3px; padding: 3px 10px; cursor: pointer; }
.trieur .lzone { flex: 1; overflow: auto; padding: 18px; min-height: 0; }
.trieur .lzone .vide { color: #eee; text-align: center; margin-top: 120px; font-size: 14px; }
.paper { background: #fff; width: 620px; margin: 0 auto; padding: 26px 30px; box-shadow: 0 3px 12px rgba(0,0,0,.35); position: relative; overflow: hidden; font-family: Arial, Helvetica, sans-serif; font-size: 8px; color: #111; line-height: 1.35; transform-origin: top center; }
.paper::after { content: "SPÉCIMEN"; position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%) rotate(-28deg); font-size: 92px; font-weight: 900; color: rgba(200, 30, 30, .11); letter-spacing: .05em; pointer-events: none; white-space: nowrap; }
.paper table { border-collapse: collapse; width: 100%; }
.paper td, .paper th { padding: 2px 4px; vertical-align: top; }

/* Carte personnage */
.carte { width: 640px; }
.carte .mb { background: #faf7f0; }
.idcard { display: grid; grid-template-columns: 110px 1fr; gap: 16px; }
.idcard .photo { width: 110px; height: 130px; border-radius: 8px; background: linear-gradient(#c9b9a6, #a8927a); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.idcard h3 { margin: 0 0 2px; font-size: 22px; }
.idcard .sub { color: #666; margin-bottom: 10px; }
.idcard table { border-collapse: collapse; font-size: 13px; width: 100%; }
.idcard td { padding: 3px 6px 3px 0; vertical-align: top; }
.idcard td:first-child { color: #777; width: 150px; }
.postit { background: #fff59d; padding: 10px 14px; margin-top: 14px; font-family: "Comic Sans MS", "Segoe Print", cursive; font-size: 13px; transform: rotate(-1deg); box-shadow: 2px 3px 6px rgba(0,0,0,.18); line-height: 1.5; }

/* Écrans plein écran (accueil, saut, récap) */
.fullscreen { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; }
.welcome { background: radial-gradient(circle at 30% 20%, #3f4b63, #1d222c); color: #fff; }
.welcome .wbox { width: 900px; max-width: 94vw; display: grid; grid-template-columns: 1fr 380px; gap: 30px; }
.welcome h1 { font-size: 30px; margin: 0 0 6px; font-weight: 600; }
.welcome .when { color: #ffd479; margin-bottom: 18px; }
.welcome ol { line-height: 1.7; padding-left: 20px; font-size: 15px; }
.welcome .warn { font-size: 13px; color: #c9cfdb; margin-top: 16px; border-left: 3px solid #ffd479; padding-left: 10px; }
.welcome .bigbtn { margin-top: 22px; background: #ffd479; color: #222; border: 0; font-size: 17px; font-weight: 700; padding: 12px 34px; border-radius: 6px; cursor: pointer; }
.welcome .mini { background: #faf7f0; color: #222; border-radius: 8px; padding: 16px; font-size: 13px; }
.timejump { background: #0f1115; color: #eee; text-align: center; }
.timejump .tj { max-width: 640px; }
.timejump h1 { font-size: 40px; font-weight: 300; font-style: italic; margin: 0 0 24px; color: #ffd479; }
.timejump p { font-size: 18px; line-height: 1.6; }
.timejump button { margin-top: 30px; background: transparent; color: #fff; border: 1px solid #888; padding: 10px 30px; font-size: 15px; border-radius: 4px; cursor: pointer; }
.recap { background: #eef0f3; }
.recap .rbox { background: #fff; width: 720px; max-width: 94vw; border-radius: 10px; padding: 28px 34px; box-shadow: 0 8px 30px rgba(0,0,0,.15); }
.recap h1 { margin: 0 0 4px; font-size: 24px; }
.recap table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
.recap td { padding: 8px 6px; border-bottom: 1px solid #eee; }
.recap td:last-child { text-align: right; font-weight: 600; }
.recap .code { font-family: Consolas, monospace; font-size: 40px; letter-spacing: .3em; text-align: center; background: #222; color: #ffd479; padding: 12px; border-radius: 8px; margin: 10px 0; }

/* Écran pédagogique (faux mail) */
.phishlesson { position: absolute; inset: 0; z-index: 70; background: #fdf6ec; overflow: auto; font-family: "Segoe UI", Arial, sans-serif; }
.phishlesson .pl { max-width: 760px; margin: 30px auto; background: #fff; border-radius: 10px; padding: 26px 32px; box-shadow: 0 4px 20px rgba(0,0,0,.12); border-top: 6px solid #e08a00; }
.phishlesson h2 { margin: 0 0 8px; }
.phishlesson .clue { display: grid; grid-template-columns: 34px 1fr; gap: 10px; margin: 12px 0; align-items: start; }
.phishlesson .clue .n { width: 30px; height: 30px; border-radius: 50%; background: #e08a00; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.phishlesson code { background: #f3f3f3; padding: 1px 5px; border-radius: 3px; color: #b3261e; }

/* Fiche professeur */
.fiche { width: 900px; }
.fiche table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0 14px; }
.fiche td, .fiche th { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
.fiche h3 { margin: 14px 0 4px; }
@media print {
  body { overflow: visible; }
  #app, .fullscreen:not(.printable) { display: none !important; }
  .overlay { position: static; background: none; }
  .modal { box-shadow: none; max-height: none; }
  .modal .mb { overflow: visible; }
}

/* Toast */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 300; box-shadow: 0 4px 14px rgba(0,0,0,.3); max-width: 600px; }

/* Bandeau cookies (générique, couleurs fixées par chaque site) */
.cookiebar { position: sticky; bottom: 0; z-index: 20; display: flex; gap: 16px; align-items: center; padding: 14px 24px; box-shadow: 0 -4px 16px rgba(0,0,0,.18); font-size: 13px; line-height: 1.45; }
.cookiebar p { margin: 0; flex: 1; }
.cookiebar button { padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; }

/* Page d'erreur du navigateur */
.neterr { max-width: 600px; margin: 90px auto; color: #5f6368; font-family: "Segoe UI", Arial, sans-serif; }
.neterr .dino { font-size: 54px; margin-bottom: 20px; }
.neterr h1 { font-weight: 400; font-size: 24px; color: #202124; margin: 0 0 14px; }
.neterr code { font-size: 12px; color: #80868b; }

/* Téléphone : demande d'une application (identité numérique) — il s'agrandit quand il attend une réponse */
#phone { transition: transform .18s; transform-origin: left bottom; }
#phone.active { transform: scale(1.75); z-index: 90; box-shadow: 0 0 0 3px #ffcf6e, 0 8px 26px rgba(0,0,0,.55); }
#phone .pinpad .app { font-size: 9px; font-weight: 700; display: flex; align-items: center; gap: 4px; margin-bottom: 5px; }
#phone .pinpad .app i { width: 12px; height: 12px; border-radius: 3px; background: #00a3a5; display: inline-block; }
#phone .pinpad .t.ask { font-size: 9.5px; line-height: 1.35; min-height: 74px; padding: 6px 8px; background: rgba(255,255,255,.1); border-radius: 8px; margin: 2px 6px 8px; }
#phone .pinpad .yn { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 0 8px; }
#phone .pinpad .yn span { border-radius: 12px; padding: 6px 4px; text-align: center; font-size: 9.5px; cursor: pointer; background: rgba(255,255,255,.16); user-select: none; }
#phone .pinpad .yn span.y { background: #00a3a5; font-weight: 700; }
#phone .pinpad .yn span:hover { filter: brightness(1.2); }
#phone.active .pinpad { background: #0c0e14; padding-top: 6px; }
#phone.active .pinpad .t { min-height: 24px; }
#phone.active .pinpad .dots { margin: 4px 0 4px; }
#phone.active .pinpad .keys { gap: 4px; }
#phone.active .pinpad .keys span { height: 22px; }
#topbar #restartbtn { height: 22px; border: 1px solid #555; background: transparent; color: #c9ccd1; border-radius: 3px; font-size: 11px; cursor: pointer; padding: 0 8px; white-space: nowrap; }
#topbar #restartbtn:hover { background: #444; color: #fff; }
/* La mission passe sur deux lignes si le bandeau est trop étroit (petits écrans) */
#topbar .mission { white-space: normal; line-height: 1.22; max-height: 32px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* ============ FISCALIS (site des impôts fictif) ============ */
.fx { font-family: Arial, Helvetica, sans-serif; color: #1e1e1e; background: #f4f3ee; font-size: 14px; }

.fx-wrap { max-width: 1180px; margin: 0 auto; padding: 20px; }
.fx-hero { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; margin-bottom: 22px; }

.fx-hero .main::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 260px; height: 260px; border-radius: 50%; border: 36px solid rgba(255,255,255,.07); }

.fx-hero .main .btn { display: inline-block; margin-top: 8px; background: #fff; color: #1f4d3a; padding: 8px 16px; font-weight: 700; font-size: 13px; border-radius: 2px; cursor: pointer; }

.fx-quick div .ic { font-size: 22px; } .fx-quick div small { display: block; font-weight: 400; color: #555; font-size: 12px; margin-top: 3px; }
.fx-cols { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
.fx-news { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fx-news .n { background: #fff; border: 1px solid #ddd; cursor: pointer; }

.fx-box { background: #fff; border: 1px solid #ddd; padding: 14px 16px; margin-bottom: 16px; }

.fx-box ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }
.fx-box li { cursor: pointer; } .fx-box li:hover { text-decoration: underline; }
.fx-life { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 6px 0 26px; }

.fx-life div .ic { font-size: 26px; display: block; margin-bottom: 6px; }
.fx-fraud { display: grid; grid-template-columns: 90px 1fr; gap: 18px; background: #fff; border-left: 5px solid #b3261e; padding: 16px 20px; margin-bottom: 26px; }

.fx-fraud h3 { margin: 0 0 6px; color: #b3261e; }
.fx-fraud p { margin: 4px 0; font-size: 13px; line-height: 1.5; }
.fx-foot { background: #183d2e; color: #d6e2db; font-size: 12.5px; margin-top: 10px; }
.fx-foot .in { max-width: 1180px; margin: 0 auto; padding: 26px 20px 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.fx-foot h4 { color: #fff; margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; }
.fx-foot div span { display: block; padding: 3px 0; cursor: pointer; } .fx-foot div span:hover { text-decoration: underline; }
.fx-foot .legal { max-width: 1180px; margin: 0 auto; padding: 12px 20px 20px; border-top: 1px solid #2f5a48; font-size: 11.5px; display: flex; gap: 16px; flex-wrap: wrap; color: #a9bfb3; }
.fx-crumb { font-size: 12px; color: #666; margin-bottom: 12px; } .fx-crumb span { cursor: pointer; text-decoration: underline; }
.fx-article { display: grid; grid-template-columns: 1fr 280px; gap: 26px; }
.fx-article h1 { font-family: Georgia, serif; color: #1f4d3a; font-size: 28px; margin: 0 0 14px; }
.fx-article .body { background: #fff; padding: 22px 26px; border: 1px solid #ddd; line-height: 1.65; font-size: 14px; }
.fx-article .chapo { font-size: 16px; color: #333; font-weight: 700; }

/* Formulaires Fiscalis */
.fx-card { background: #fff; border: 1px solid #d5d1c4; padding: 24px 28px; border-radius: 3px; }
.fx-card h2 { margin: 0 0 6px; font-size: 19px; color: #1f4d3a; }

.fx-field { margin-bottom: 15px; }

.fx-field label small { font-weight: 400; color: #666; }
.fx-field input[type=text], .fx-field input[type=password], .fx-field input[type=email] { width: 100%; max-width: 380px; height: 38px; border: 1px solid #8a8a8a; border-radius: 2px; padding: 0 10px; font-size: 15px; }

.fx-btn { background: #1f4d3a; color: #fff; border: 0; padding: 10px 22px; font-size: 14px; font-weight: 700; border-radius: 2px; cursor: pointer; }

.fx-btn.sec { background: #fff; color: #1f4d3a; border: 1px solid #1f4d3a; }
.fx-link { color: #1f4d3a; text-decoration: underline; cursor: pointer; font-size: 13px; }

.fx-ok { background: #e8f3ec; border-left: 4px solid #1f7a4a; color: #12482b; padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; line-height: 1.5; }
.fx-info { background: #eef2f6; border-left: 4px solid #5b6f86; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.5; color: #2c3a4a; }
.fx-steps { display: flex; gap: 0; margin: 4px 0 20px; font-size: 12.5px; }

.fx-steps div.on { background: #1f4d3a; color: #fff; font-weight: 700; }
.fx-steps div.done { background: #b9cfc2; color: #1f4d3a; }
.fx-gauge { height: 6px; background: #e3e3e3; max-width: 380px; margin-top: 6px; border-radius: 3px; overflow: hidden; }

.fx-rules li { padding: 2px 0; } .fx-rules li.ok { color: #1f7a4a; } .fx-rules li.ko { color: #b3261e; }
.fx-code { display: flex; gap: 8px; margin: 10px 0 6px; }
.fx-code input { width: 44px; height: 52px; text-align: center; font-size: 24px; border: 1px solid #8a8a8a; border-radius: 3px; }
.fx-login { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; max-width: 980px; margin: 0 auto; }
.fx-espace-head { background: #fff; border-bottom: 1px solid #ddd; }
.fx-espace-head .in { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; }
.fx-tabs { background: #2a5f49; }
.fx-tabs .in { max-width: 1180px; margin: 0 auto; display: flex; padding: 0 12px; }
.fx-tabs span { color: #fff; padding: 11px 14px; font-size: 13.5px; cursor: pointer; }

.fx-dash { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.fx-dash .fx-box { margin: 0; }
.fx-dash .big { font-size: 26px; font-weight: 700; color: #1f4d3a; }
.fx-pdf { background: #525659; border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.fx-pdf .bar { display: flex; gap: 16px; align-items: center; background: #323639; color: #f1f1f1; padding: 8px 14px; font-size: 13px; }

.fx-pdf .pages { padding: 20px; max-height: 70vh; overflow: auto; }
.fx-doclist div { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dotted #ccc; font-size: 13px; cursor: pointer; }

.sa-btn { display: inline-block; background: #5b2a6e; color: #fff; padding: 10px 20px; border-radius: 22px; font-weight: 700; border: 0; font-size: 13.5px; cursor: pointer; font-family: inherit; }

/* ---------- Téléphone ---------- */
// pinRequest : demande affichée sur le téléphone.
//   stage 'confirm' : une application demande « Est-ce bien vous ? » (Non / Oui)

let pinRequest = null;

function renderPhone() {

    if (R.stage === 'confirm') {
      pin = `<div class="pinpad">${app}<div class="t ask">${R.html}</div><div class="yn"><span data-pk="no">Non, refuser</span><span data-pk="yes" class="y">Oui, c'est moi</span></div></div>`;
    } else {
      const dots = [0, 1, 2, 3].map(i => `<i class="${i < R.typed.length ? 'f' : ''}"></i>`).join('');
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', R.app ? '✕' : '', '0', '⌫'].map(k => `<span data-k="${k}">${k}</span>`).join('');
      pin = `<div class="pinpad">${app}<div class="t">${h(R.text)}</div><div class="dots">${dots}</div><div class="err">${R.err || ''}</div><div class="keys">${keys}</div></div>`;
    }
  }
  $('#phone').classList.toggle('active', !!R);
  $('#phone').innerHTML = `<div class="scr"><div class="sbar"><span>${hhmm(d)}</span><span>📶 4G ▮▮▮▯</span></div>

    ${unread ? `<span class="badge">${unread}</span>` : ''}`;
  $('#deskclock').textContent = longDate(d) + ' — ' + hhmm(d);
}
function phoneShow(req) {
  // Une demande inattendue en cours passe d'abord : il faut y répondre avant de voir la suivante
  if (pinRequest && pinRequest.fake) { pinRequest.next = req; return; }
  pinRequest = req; renderPhone();
}
function phoneDone() {
  const next = pinRequest && pinRequest.next;
  pinRequest = next || null; renderPhone();
}
function phoneAskPin(text, onOk, onCancel) {
  phoneShow({ stage: 'pin', text, typed: '', onOk, onCancel, err: '', expect: P.pinTelephone });
}
/* Demande de confirmation d'une application (identité numérique) : « Est-ce bien vous ? » puis code secret */
function phoneAskConfirm(o) {
  phoneShow(Object.assign({ stage: 'confirm', typed: '', err: '', tries: 0 }, o));
}
function phoneCancel(id) { if (pinRequest && pinRequest.id === id) phoneDone(); else if (pinRequest && pinRequest.next && pinRequest.next.id === id) pinRequest.next = null; }
function phoneChoice(v) {
  const R = pinRequest;
  if (!R || R.stage !== 'confirm') return;
  if (v === 'yes') { R.stage = 'pin'; renderPhone(); return; }
  phoneDone(); R.onRefuse && R.onRefuse();
}
function phoneKey(k) {
  const R = pinRequest;
  if (!R || R.stage !== 'pin') return;
  if (k === '✕') { phoneDone(); (R.onRefuse || R.onCancel || (() => {}))(); return; }
  if (k === '⌫') R.typed = R.typed.slice(0, -1);
  else if (k && R.typed.length < 4) R.typed += k;
  R.err = '';
  if (R.typed.length === 4) {
    if (R.typed === R.expect) { phoneDone(); R.onOk && R.onOk(); return; }
    R.typed = ''; R.err = 'Code incorrect'; R.tries = (R.tries || 0) + 1;
    R.onWrong && R.onWrong(R);
    if (R.maxTries && R.tries >= R.maxTries) { phoneDone(); R.onBlocked && R.onBlocked(); return; }
  }
  renderPhone();
}

/* ---------- Navigateur fictif ---------- */
let tabSeq = 1;
function parseUrl(u) {
  u = String(u || '').trim().replace(/^https?:\/\//i, '');
  const m = u.match(/^([^\/?#]*)([^?#]*)(\?[^#]*)?/);
  const host = (m[1] || '').toLowerCase().replace(/^www\./, '');
  const path = m[2] || '/';
  const params = {};
  (m[3] || '').slice(1).split('&').filter(Boolean).forEach(kv => {
    const [k, v = ''] = kv.split('=');
    params[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' '));
  });
  return { host, path, params, url: host + path + (m[3] || '') };
}
function curTab() { return S.tabs.find(t => t.id === S.activeTab); }
function openTab(url, focus = true) {
  const t = { id: tabSeq++, history: [], idx: -1, title: 'Nouvel onglet', fav: null };
  S.tabs.push(t);
  if (focus) S.activeTab = t.id;
  navigate(url || 'trouvo.sim', t);
  return t;
}
function closeTab(id) {
  const i = S.tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  S.tabs.splice(i, 1);
  if (!S.tabs.length) { openTab('trouvo.sim'); return; }
  if (S.activeTab === id) S.activeTab = S.tabs[Math.max(0, i - 1)].id;
  renderBrowser();
}
function navigate(url, tab = curTab(), opts = {}) {
  const t = tab;
  // URL relative au site courant
  if (url.startsWith('/') && t.history[t.idx]) url = parseUrl(t.history[t.idx]).host + url;
  const p = parseUrl(url);
  if (!opts.replace) { t.history = t.history.slice(0, t.idx + 1); t.history.push(p.url); t.idx++; }
  else t.history[t.idx] = p.url;
  if (t.id === S.activeTab) renderBrowser(); else renderTabs();
  if (t.id === S.activeTab) { const lb = $('#loadingbar'); lb.style.transition = 'none'; lb.style.width = '0'; lb.offsetWidth; lb.style.transition = ''; lb.style.width = '100%'; setTimeout(() => lb.style.width = '0', 420); }
}
function goBack() { const t = curTab(); if (t.idx > 0) { t.idx--; renderBrowser(); } }
function goFwd() { const t = curTab(); if (t.idx < t.history.length - 1) { t.idx++; renderBrowser(); } }
function reload() { renderBrowser(); }
function ctxFor(t) {
  const p = parseUrl(t.history[t.idx]);
  return Object.assign(p, { tab: t, site: SITES[p.host] });
}
function renderTabs() {
  $('#tabstrip').innerHTML = S.tabs.map(t => {
    const p = parseUrl(t.history[t.idx] || '');
    const site = SITES[p.host];
    const fav = site ? site.fav : { bg: '#9aa0a6', t: '•' };
    return `<div class="btab ${t.id === S.activeTab ? 'active' : ''}" data-tab="${t.id}" title="${h(t.title)}">
      <span class="fav" style="background:${fav.bg}">${fav.t}</span><span class="ttl">${h(t.title)}</span><span class="x" data-close="${t.id}">✕</span></div>`;
  }).join('') + '<button id="newtabbtn" title="Nouvel onglet">+</button>';
}
function renderBrowser() {
  const t = curTab();
  if (!t) return;
  const ctx = ctxFor(t);
  const site = ctx.site;
  let out;
  if (!site) out = { title: ctx.host || 'Nouvel onglet', html: netError(ctx.host) };
  else out = site.render(ctx) || { title: site.name, html: '' };
  t.title = out.title;
  // Barre d'adresse
  const insecure = site && site.insecure;
  $('#secure').className = 'secure' + (insecure ? ' bad' : '');
  $('#secure').innerHTML = insecure ? '⚠ Non sécurisé' : (site ? '🔒' : 'ⓘ');
  $('#secure').title = insecure ? 'La connexion à ce site n\'est pas sécurisée' : 'La connexion est sécurisée';
  $('#urlinput').value = ctx.url === 'trouvo.sim/' ? '' : (insecure ? 'http://' : 'https://') + ctx.url;
  $('#urlinput').placeholder = 'Rechercher sur Trouvo ou saisir une adresse';
  $('#keyic').classList.toggle('hidden', !S.browser.saved[ctx.host]);
  $('#btnback').disabled = t.idx <= 0;
  $('#btnfwd').disabled = t.idx >= t.history.length - 1;
  // Contenu
  const vp = $('#viewport');
  let cookie = '';
  if (site && site.cookie && !S.browser.cookies[ctx.host]) cookie = site.cookie();
  vp.innerHTML = `<div class="page ${site ? site.cls || '' : ''}">${out.html}${cookie}</div>`;
  vp.scrollTop = 0;
  $('#pwdprompt').classList.add('hidden');
  // Cartouche « En vrai »
  const ev = $('#envraifloat');
  const evText = site && (typeof site.envrai === 'function' ? site.envrai(ctx) : site.envrai);
  if (evText && !S.browser.envraiClosed[ctx.host]) { ev.innerHTML = evText + '<span class="close" title="Masquer">✕</span>'; ev.classList.remove('hidden'); }
  else ev.classList.add('hidden');
  renderTabs();
  if (site && site.after) { try { site.after(vp.firstElementChild, ctx); } catch (e) { console.error(e); } }
  renderGate();
}
function netError(host) {

    <p>Impossible de trouver l'adresse IP du serveur de <b>${h(host)}</b>.</p>
    <p>Essayez de :</p><ul><li>Vérifier si l'adresse comporte une faute de frappe</li><li>Rechercher le site sur Trouvo</li></ul>

function omniboxGo(v) {

/* ---------- Étapes, codes de passage, masque ---------- */
function setMission() {
  const key = S.step === 2 && S.phase2 === 'apres' ? '2b' : S.step;
  const txt = CONFIG.missions[key] || '';
  $('#mission').title = txt;
  $('#restartbtn').style.display = S.step >= 1 && S.step <= 4 ? '' : 'none';
  $('#mission').innerHTML = S.step ? `<b>${S.step >= 5 ? 'Fin' : 'Étape ' + S.step}</b>${h(txt)}` : '';
}
function completeStep(n) {
  if (S.waitingCode >= n) return;
  S.waitingCode = n;
  renderGate();
}
function renderGate() {
  let g = $('#gate');
  if (!S.waitingCode) { g && g.remove(); return; }
  if (!g) { g = document.createElement('div'); g.id = 'gate'; g.className = 'gate'; $('#browser').appendChild(g); }
  g.innerHTML = `<div class="box"><h2>✔ Étape ${S.waitingCode} terminée</h2>
    <p>Bravo, vous avez atteint l'objectif de cette étape.</p>

}
/* Bouton « Recommencer l'étape » : remet le simulateur au début de l'étape en cours.
   Les incidents déjà relevés pour le récapitulatif sont conservés. */
function restartStep() {
  if (S.step < 1 || S.step > 4) return;
  if (!confirm('Recommencer l\'étape ' + S.step + ' depuis le début ?\n\nCe que vous avez fait dans cette étape sera effacé.')) return;
  if (S.step === 1) { const inc = S.incidents; resetAll(); $$('.fullscreen.welcome').forEach(o => o.remove()); S.incidents = inc; S.step = 1; setMission(); renderBrowser(); return; }
  gotoStep(S.step);
}
function enterCode(raw) {
  const c = digits(raw);
  const box = $('#codebox');
  const fail = () => { box.classList.remove('err'); void box.offsetWidth; box.classList.add('err'); };
  if (c.length !== 3) return fail();
  $('#codeinput').value = '';
  if (c === CONFIG.codes.reinitialisation) { if (confirm('Tout remettre à zéro ?')) resetAll(); return; }
  if (c === CONFIG.codes.etape2) return gotoStep(2);
  if (c === CONFIG.codes.etape3) return gotoStep(3);
  if (c === CONFIG.codes.etape4) return gotoStep(4);
  if (c === CONFIG.codes.recap) return gotoStep(5);
  fail();
}

/* Met le simulateur dans l'état attendu au début de l'étape n */
function gotoStep(n) {
  const prev = S.step;
  S.waitingCode = 0;
  $$('.overlay').forEach(o => o.remove());
  // On retire les mails produits pendant cette étape et les suivantes
  S.mails = S.mails.filter(m => m.etape < n || m.keep);
  S.notifs = []; pinRequest = null;
  Object.assign(S.maboite, { view: 'list', folder: 'inbox', openId: null, search: '' });
  const F = S.fiscalis;
  let notice = '';
  if (n >= 2) {
    if (!F.account || !F.account.active) {
      F.account = { numero: P.numeroFiscal, mail: P.mail, password: CONFIG.reprise.motDePasseFiscalis, initialPassword: CONFIG.reprise.motDePasseFiscalis, active: true };
      F.pending = null;
      notice = `Votre espace Fiscalis a été créé pour vous.<br>Numéro fiscal : <b>${fmtNF(P.numeroFiscal)}</b><br>Mot de passe : <b>${h(CONFIG.reprise.motDePasseFiscalis)}</b><br><br>Notez-le sur votre fiche.`;
    }
    if (!S.mails.some(m => m.tag === 'activation')) {
      deliverMail(mailActivationFiscalis('done'), { delay: 0, silent: true });
      S.mails[0].read = true; S.mails[0].etape = 1; S.mails[0].folder = 'spam';
    }
    F.loggedIn = false; F.failures = 0; F.lockedUntil = 0; F.code = null; F.loginStage = null; F.resetTokens = {};
  }
  if (n === 2) {
    S.step = 2; S.phase2 = 'avant';
    F.account.password = F.account.initialPassword;
    F.oldPasswords = []; F.phishSent = false;
    setClock(Object.assign({}, CONFIG.horloge.depart, { minute: CONFIG.horloge.depart.minute + 25 }));
    S.tabs.forEach(t => t.history = t.history.filter(u => !u.includes('/activation')));
    S.tabs = S.tabs.filter(t => t.history.length); if (!S.tabs.length) openTab('fiscalis.gouv.sim', true);
    S.activeTab = S.tabs[S.tabs.length - 1].id;
    navigate('fiscalis.gouv.sim');
  }
  if (n >= 3) {
    S.phase2 = 'apres';
    if (F.oldPasswords.length === 0) { F.oldPasswords.push(F.account.password); F.account.password = CONFIG.motDePasseChangeTelephone; }
    if (n === 3 || prev < 3) setClock(Object.assign({}, CONFIG.horloge.apresSaut, { minute: CONFIG.horloge.apresSaut.minute + 20 }));
    if (!S.mails.some(m => m.tag === 'inter')) addIntermediateMails(true);
    if (n < 5) { S.santea.loggedIn = false; S.numerid = { status: null, authOk: null, session: false }; S.forma = { loggedIn: false, dossiers: [] }; }
  }
  if (n === 3) {
    S.step = 3;
    S.tabs = []; openTab('trouvo.sim');
  }
  if (n === 4) {
    S.step = 4;
    setClock(Object.assign({}, CONFIG.horloge.apresSaut, { minute: CONFIG.horloge.apresSaut.minute + 45 }));
    S.tabs = []; openTab('trouvo.sim');
    const m = CONFIG.mailEtape4;
    if (m) deliverMail({ fromName: m.de, fromAddr: m.adresse, subject: m.objet, html: m.corps, etape: 4 }, { delay: 1500 });
    if (CONFIG.fausseDemande.active && !S.incidents.fausseDemande) later(fakeRequest, CONFIG.durees.delaiFausseDemande * 1000);
  }
  if (n === 5) { S.step = 5; showRecap(); }
  setMission(); renderMail(); renderPhone(); renderBrowser();
  if (notice) openModal('Reprise', `<div style="font-size:15px;line-height:1.6;max-width:420px">${notice}</div>`);
}

/* Saut dans le temps (après la première déconnexion de l'étape 2) */

function addIntermediateMails(silent) {

/* ---------- Réinitialisation complète ---------- */

/* ---------- Montage de l'interface ---------- */
function buildShell() {

      <span class="codebox" id="codebox">Code de passage <input id="codeinput" maxlength="3" inputmode="numeric" autocomplete="off"><button id="codeok">OK</button></span>
    </div>
    <div id="main">
      <div id="browser">
        <div id="tabstrip"></div>
        <div id="toolbar">
          <button class="tbtn" id="btnback" title="Précédent">←</button>
          <button class="tbtn" id="btnfwd" title="Suivant">→</button>

          <button class="tbtn" title="Téléchargements">⤓</button>

          <button class="tbtn" title="Personnaliser et contrôler">⋮</button>
        </div>
        <div id="viewport"></div>
        <div id="loadingbar"></div>
        <div id="pwdprompt" class="hidden"></div>
        <div id="envraifloat" class="envrai hidden"></div>
      </div>
      <div id="side">
        <div id="mail"></div>
        <div id="desk">
          <div id="phone" title="Téléphone"></div>
          <div id="deskitems">
            <button class="deskbtn" id="btnpapiers"><span class="ic">🗂️</span><span>Mes papiers<small>Le trieur de la maison</small></span></button>
            <button class="deskbtn" id="btncarte"><span class="ic">🪪</span><span>Ma carte<small>Qui suis-je ?</small></span></button>
            <div class="deskclock" id="deskclock"></div>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  $('#codeok').onclick = () => enterCode($('#codeinput').value);
  $('#restartbtn').onclick = restartStep;
  $('#codeinput').addEventListener('keydown', e => { if (e.key === 'Enter') enterCode(e.target.value); });
  $('#btnback').onclick = goBack; $('#btnfwd').onclick = goFwd; $('#btnreload').onclick = reload;
  $('#urlinput').addEventListener('keydown', e => { if (e.key === 'Enter') { omniboxGo(e.target.value); e.target.blur(); } });
  $('#urlinput').addEventListener('focus', e => setTimeout(() => e.target.select(), 0));
  $('#keyic').onclick = () => { const c = savedCreds(parseUrl(curTab().history[curTab().idx]).host); if (c) toast('Mot de passe enregistré pour ' + c.user + ' : ••••••••'); };
  $('#tabstrip').addEventListener('click', e => {
    const x = e.target.closest('[data-close]');
    if (x) { closeTab(+x.dataset.close); return; }
    if (e.target.closest('#newtabbtn')) { openTab('trouvo.sim'); return; }
    const t = e.target.closest('[data-tab]');
    if (t) { S.activeTab = +t.dataset.tab; renderBrowser(); }
  });
  $('#envraifloat').addEventListener('click', e => {
    if (e.target.classList.contains('close')) { S.browser.envraiClosed[parseUrl(curTab().history[curTab().idx]).host] = true; $('#envraifloat').classList.add('hidden'); }
  });
  // Délégation des événements dans les pages des sites
  const vp = $('#viewport');
  vp.addEventListener('click', e => {
    const ctx = ctxFor(curTab());
    const act = e.target.closest('[data-act]');
    if (act) {
      e.preventDefault();
      if (act.dataset.act === 'cookie') { S.browser.cookies[ctx.host] = act.dataset.v; const cb = $('[data-cookiebar]', vp); cb && cb.remove(); return; }
      ctx.site && ctx.site.action && ctx.site.action(act.dataset.act, act, ctx, vp.firstElementChild);
      return;
    }
    const go = e.target.closest('[data-go]');
    if (go) { e.preventDefault(); if (go.dataset.newtab != null) openTab(go.dataset.go.startsWith('/') ? ctx.host + go.dataset.go : go.dataset.go); else navigate(go.dataset.go); return; }
    if (e.target.closest('a')) e.preventDefault();
  });
  vp.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target.closest('form[data-form]');
    const ctx = ctxFor(curTab());
    if (f && ctx.site && ctx.site.submit) ctx.site.submit(f.dataset.form, f, ctx, vp.firstElementChild);
  });
  // Bulle d'adresse en bas à gauche au survol d'un lien (comme un vrai navigateur)
  const status = document.createElement('div');
  status.style.cssText = 'position:absolute;left:0;bottom:0;background:#f1f3f4;border:1px solid #dadce0;border-left:0;border-bottom:0;border-radius:0 6px 0 0;padding:2px 8px;font-size:11.5px;color:#3c4043;z-index:35;display:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  $('#browser').appendChild(status);
  vp.addEventListener('mouseover', e => {
    const go = e.target.closest('[data-go]');
    if (!go) { status.style.display = 'none'; return; }
    let u = go.dataset.go;
    if (u.startsWith('/')) u = parseUrl(curTab().history[curTab().idx]).host + u;
    const site = SITES[parseUrl(u).host];
    status.textContent = (site && site.insecure ? 'http://' : 'https://') + u.split('?')[0];
    status.style.display = 'block';
  });
  vp.addEventListener('mouseleave', () => status.style.display = 'none');

  $('#phone').addEventListener('click', e => { const k = e.target.closest('[data-k]'); if (k) { phoneKey(k.dataset.k); return; } const c = e.target.closest('[data-pk]'); if (c) phoneChoice(c.dataset.pk); });
  $('#btnpapiers').onclick = openTrieur;
  $('#btncarte').onclick = () => openModal('Ma carte', carteHtml(false), 'carte');
  // Fonctions professeur
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.altKey && (e.key === 'r' || e.key === 'R')) { e.preventDefault(); if (confirm('Réinitialisation complète du simulateur ?')) resetAll(); }
    if (e.ctrlKey && e.altKey && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); openFicheProf(); }
  });
  $('#simlabel').addEventListener('dblclick', e => { if (e.shiftKey) openFicheProf(); });
}

window.addEventListener('DOMContentLoaded', () => { buildShell(); resetAll(); });


/* =====================================================================
   MaBoîte : webmail fictif (panneau de droite)
   ===================================================================== */
function initialMails() {
  (CONFIG.mailsInitiaux || []).slice().reverse().forEach(m => {
    deliverMail({ fromName: m.de, fromAddr: m.adresse, subject: m.objet, html: m.corps, dayLabel: m.jour, folder: m.dossier || 'inbox', etape: 0, keep: true }, { delay: 0, silent: true });
    S.mails[0].read = !!m.lu;
  });
}
const avColor = s => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) % 360; return `hsl(${x},45%,45%)`; };
const FOLDERS = [['inbox', 'Réception'], ['spam', 'Indésirables'], ['sent', 'Envoyés'], ['trash', 'Corbeille']];

function renderMail() {
  const M = S.maboite;
  const el = $('#mail');
  if (!el) return;
  const head = `<div class="mhead"><span class="logo">Ma<span>Boîte</span></span><span class="sp"></span>
    ${M.loggedIn ? `<span class="who" title="${h(P.mail)}">${h(P.mail)}</span><span class="mi" data-m="settings" title="Paramètres">⚙</span>` : ''}
    <span class="mi" data-m="wide" title="Agrandir / réduire">⤢</span></div>`;
  if (!M.loggedIn) { el.innerHTML = head + mailLoginView(); return; }
  if (M.view === 'settings') { el.innerHTML = head + `<div class="mbody">${mailSettingsView()}</div>`; return; }
  const cnt = f => S.mails.filter(m => m.folder === f && !m.read).length;
  const folders = `<div class="mfolders">${FOLDERS.map(([k, n]) => {
    const c = cnt(k);
    return `<span class="${M.folder === k ? 'on' : ''}" data-folder="${k}">${n}${c && (k === 'inbox' || k === 'spam') ? `<span class="cnt ${k === 'spam' ? 'spam' : ''}">${c}</span>` : ''}</span>`;
  }).join('')}</div>`;
  let body;
  if (M.view === 'read') {
    const m = S.mails.find(x => x.id === M.openId);
    body = m ? mailReadView(m) : '';
  } else {
    const q = norm(M.search);
    const list = S.mails.filter(m => m.folder === M.folder && (!q || norm(m.subject + m.fromName + m.fromAddr).includes(q)));
    const note = M.folder === 'spam' ? '<div class="mspamnote">Les messages de ce dossier sont supprimés automatiquement après 30 jours.</div>' : '';
    body = note + (list.length ? list.map(m => `<div class="mrow ${m.read ? '' : 'unread'} ${m.fresh ? 'new' : ''}" data-open="${m.id}">
        <span class="from">${h(m.fromName)}</span><span class="time">${mailTime(m)}</span><span class="subj">${h(m.subject)}</span></div>`).join('')
      : `<div class="mempty">${q ? 'Aucun message ne correspond à votre recherche.' : 'Aucun message dans ce dossier.'}</div>`);
  }
  const search = M.view === 'read' ? '' : `<div class="msearch"><input id="msearch" placeholder="Rechercher dans les messages" value="${h(M.search)}"></div>`;
  el.innerHTML = head + folders + search + `<div class="mbody">${body}</div><div id="mstatus" style="display:none;font-size:11px;padding:2px 8px;background:#f1f3f4;border-top:1px solid #dadce0;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>`;
  const si = $('#msearch');
  if (si) si.addEventListener('input', e => { M.search = e.target.value; const pos = e.target.selectionStart; renderMail(); const n = $('#msearch'); n.focus(); n.setSelectionRange(pos, pos); });
}

function mailReadView(m) {
  const spam = m.folder === 'spam';
  return `<div class="mread"><div class="mrtools"><span data-m="back">← Retour</span>
      ${spam ? '<span data-m="notspam">Ce n\'est pas un spam</span>' : (m.folder === 'inbox' ? '<span data-m="spam">Signaler comme spam</span>' : '')}
      <span data-m="delete" title="Supprimer">🗑 Supprimer</span></div>
    <h3>${h(m.subject)}</h3>
    <div class="mmeta"><span class="av" style="background:${avColor(m.fromName)}">${h(m.fromName.replace(/[^A-Za-zÀ-ÿ]/g, '').charAt(0).toUpperCase() || '?')}</span>
      <span><b>${h(m.fromName)}</b> &lt;${h(m.fromAddr)}&gt;</span><span>À : moi · ${mailTime(m)}</span></div>
    ${spam ? '<div class="spamwarn">⚠ Ce message a été classé dans les indésirables. Soyez prudent avec les liens et les pièces jointes.</div>' : ''}
    <div class="mcontent">${m.html}</div></div>`;
}

function mailLoginView() {
  const M = S.maboite;
  return `<div class="mbody"><div class="mlogin"><h3>Connexion à MaBoîte</h3><p>Votre messagerie gratuite, simple et sécurisée.</p>
    <form id="mloginform"><label>Adresse mail</label><input name="u" value="${h(M.lastUser || '')}" autocomplete="off">

    ${M.passkey ? `<div class="envrai" style="margin-top:18px">Google, Apple, Microsoft proposent les clés d'accès. Les sites publics (impôts, ameli) utilisent plutôt mot de passe + code par mail. Ne créez pas de clé d'accès sur un appareil partagé.</div>` : ''}

}

function mailSettingsView() {
  const M = S.maboite;
  const crumbs = ['Paramètres'].concat(M.settings === 'securite' ? ['Sécurité'] : M.settings === 'general' ? ['Général'] : []);
  let body = '';
  if (!M.settings) {
    body = `<div class="menu"><div data-m="set-general">Général <span>›</span></div><div data-m="set-securite">Sécurité <span>›</span></div>

      <div class="sec"><h4>Clés d'accès</h4>
        ${M.passkey ? '<p>✅ <b>1 clé d\'accès</b> : « Téléphone de Martine », créée aujourd\'hui.</p><p>Vous pouvez maintenant vous connecter sans mot de passe.</p>'
          : '<p>Une clé d\'accès permet de vous connecter avec le code de déverrouillage de votre téléphone, sans saisir de mot de passe.</p><p>Aucune clé d\'accès.</p>'}
        <div id="passkeyzone" style="margin-top:8px">${M.passkey ? '' : '<button class="mbtn" data-m="passkey">Créer une clé d\'accès</button>'}</div></div>
      ${M.passkey ? '<div class="envrai">Google, Apple, Microsoft proposent les clés d\'accès. Les sites publics (impôts, ameli) utilisent plutôt mot de passe + code par mail. Ne créez pas de clé d\'accès sur un appareil partagé.</div>' : ''}
      <div class="sec"><h4>Appareils connectés</h4><p>Ordinateur — Penhoat-sur-Ellé — actuellement<br>Téléphone — Penhoat-sur-Ellé — il y a 3 jours</p></div>`;
  } else {
    body = `<div class="sec"><h4>${M.settings === 'general' ? 'Langue et affichage' : 'Réglages'}</h4><p>Ces réglages ne sont pas utiles pour aujourd'hui.</p></div>`;
  }
  return `<div class="mset"><div class="crumbs">${crumbs.join(' › ')}</div>
    <div style="margin-bottom:8px"><span data-m="${M.settings ? 'set-root' : 'close-settings'}" style="cursor:pointer;color:#3b5b8c">← Retour</span></div>
    <h3>${crumbs[crumbs.length - 1]}</h3>${body}</div>`;
}

function mailClick(e) {
  const M = S.maboite;
  const link = e.target.closest('[data-url]');
  if (link) { e.preventDefault(); openTab(link.dataset.url); return; }
  const f = e.target.closest('[data-folder]');
  if (f) { M.folder = f.dataset.folder; M.view = 'list'; renderMail(); return; }
  const o = e.target.closest('[data-open]');
  if (o) {
    const m = S.mails.find(x => x.id === +o.dataset.open);
    m.read = true; m.fresh = false; M.view = 'read'; M.openId = m.id;
    if (m.onOpen) m.onOpen(m);
    renderMail(); renderPhone(); return;
  }
  const b = e.target.closest('[data-m]');
  if (!b) return;
  const cur = S.mails.find(x => x.id === M.openId);
  switch (b.dataset.m) {
    case 'wide': $('#main').classList.toggle('mailwide'); break;
    case 'back': M.view = 'list'; break;
    case 'delete': if (cur) cur.folder = 'trash'; M.view = 'list'; break;
    case 'notspam': if (cur) cur.folder = 'inbox'; toast('Message déplacé dans la boîte de réception.'); M.view = 'list'; break;
    case 'spam': if (cur) cur.folder = 'spam'; toast('Message déplacé dans les indésirables.'); M.view = 'list'; break;
    case 'settings': M.view = 'settings'; M.settings = null; break;
    case 'close-settings': M.view = 'list'; break;
    case 'set-root': M.settings = null; break;
    case 'set-general': M.settings = 'general'; break;
    case 'set-securite': M.settings = 'securite'; break;
    case 'set-filtres': M.settings = 'filtres'; break;
    case 'set-signature': M.settings = 'signature'; break;
    case 'logout': M.loggedIn = false; M.view = 'list'; M.lastUser = P.mail; break;
    case 'forgot': $('#mpasskeymsg').textContent = 'Un code de récupération a été envoyé par SMS au 06 •• •• •• 83.'; return;
    case 'passkey':
      $('#passkeyzone').innerHTML = '<p style="font-size:12.5px"><b>Utilisez le code de déverrouillage de votre téléphone.</b><br>Regardez l\'écran de votre téléphone.</p>';
      phoneAskPin('MaBoîte : créer une clé d\'accès. Saisissez le code de votre téléphone.', () => { M.passkey = true; renderMail(); toast('Clé d\'accès créée.'); });
      return;
    case 'passkeylogin':
      if (!M.passkey) { $('#mpasskeymsg').textContent = 'Aucune clé d\'accès n\'est disponible sur cet appareil pour MaBoîte.'; return; }
      $('#mpasskeymsg').textContent = 'Confirmez sur votre téléphone…';
      phoneAskPin('Se connecter à MaBoîte avec votre clé d\'accès ? Saisissez le code de votre téléphone.', () => { M.loggedIn = true; M.view = 'list'; renderMail(); });
      return;
  }
  renderMail();
}
function mailSubmit(e) {
  if (e.target.id !== 'mloginform') return;
  e.preventDefault();
  const u = e.target.u.value.trim().toLowerCase(), p = e.target.p.value;
  if (u === P.maboite.identifiant && p === P.maboite.motDePasse) { S.maboite.loggedIn = true; S.maboite.view = 'list'; renderMail(); }
  else $('#mloginerr').textContent = 'Adresse mail ou mot de passe incorrect.';
}
window.addEventListener('DOMContentLoaded', () => {
  const el = $('#mail');
  el.addEventListener('click', mailClick);
  el.addEventListener('submit', mailSubmit);
  el.addEventListener('mouseover', e => {
    const st = $('#mstatus'); if (!st) return;
    const l = e.target.closest('[data-url]');
    if (l) { const u = l.dataset.url; const site = SITES[parseUrl(u).host]; st.textContent = (site && site.insecure ? 'http://' : 'https://') + u; st.style.display = 'block'; }
    else st.style.display = 'none';
  });
});


/* =====================================================================
   Trieur de papiers + carte personnage
   ===================================================================== */
const POCHETTES = [['banque', 'Banque'], ['sante', 'Santé'], ['impots', 'Impôts'], ['divers', 'Divers']];
let trieurState = { open: null, zoom: 1, closed: {} };

function openTrieur() {
  const ov = openModal('Mes papiers', `<div class="pochettes" id="pochettes"></div>
    <div class="lecteur"><div class="ltools"><span id="ldoctitle">Aucun document ouvert</span><span style="flex:1"></span>
      <button data-z="-">－</button><span id="lzoom">100 %</span><button data-z="+">＋</button><button data-z="0">Taille réelle</button></div>
      <div class="lzone" id="lzone"><div class="vide">Cliquez sur un document dans une pochette pour l'ouvrir.</div></div></div>`, 'trieur');
  const draw = () => {
    $('#pochettes', ov).innerHTML = POCHETTES.map(([k, n]) => {
      const docs = P.documents.filter(d => d.pochette === k);
      return `<div class="pochette p-${k} ${trieurState.closed[k] ? 'closed' : ''}"><span class="ong" data-poch="${k}">${n}</span><div class="contenu">
        ${docs.map(d => `<div class="doc ${trieurState.open === d.id ? 'on' : ''}" data-doc="${d.id}"><span class="pg">📄</span>${h(d.titre)}</div>`).join('') || '<i style="font-size:11px">vide</i>'}</div></div>`;
    }).join('') + '<p style="font-size:11px;color:#6b5a3a;margin:16px 4px">Cliquez sur l\'onglet d\'une pochette pour l\'ouvrir ou la fermer.</p>';
    const d = P.documents.find(x => x.id === trieurState.open);
    if (d) {
      $('#ldoctitle', ov).textContent = d.titre;
      $('#lzone', ov).innerHTML = `<div class="paper" style="zoom:${trieurState.zoom}">${renderDoc(d)}</div>`;
    }
    $('#lzoom', ov).textContent = Math.round(trieurState.zoom * 100) + ' %';
  };
  ov.addEventListener('click', e => {
    const p = e.target.closest('[data-poch]');
    if (p) { trieurState.closed[p.dataset.poch] = !trieurState.closed[p.dataset.poch]; draw(); return; }
    const d = e.target.closest('[data-doc]');
    if (d) { trieurState.open = d.dataset.doc; draw(); $('#lzone', ov).scrollTop = 0; return; }
    const z = e.target.closest('[data-z]');
    if (z) { const v = z.dataset.z; trieurState.zoom = v === '0' ? 1 : Math.min(2.6, Math.max(.6, trieurState.zoom + (v === '+' ? .2 : -.2))); draw(); }
  });
  draw();
}

function renderDoc(d) {
  switch (d.type) {
    case 'avis': return docAvis(d.d);
    case 'echeancier': return docEcheancier();
    case 'courrierSante': return docSantea();
    case 'mutuelle': return docMutuelle();
    case 'releve': return docReleve();
    case 'facture': return docFacture();
  }
  return '';
}

const ministere = `<div style="display:flex;gap:6px;align-items:center"><div style="width:30px;height:30px;border-radius:50%;background:#1f4d3a;color:#e8c46a;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;font-family:Georgia">F</div>
  <div style="font-size:7px;line-height:1.2"><b style="font-size:9px">FISCALIS</b><br>ADMINISTRATION DES FINANCES<br>PUBLIQUES FICTIVES</div></div>`;

function docAvis(a) {
  const jy = a.declarant.includes('Jean');
  const nn = jy ? 'LE GALL' : 'KERJEAN';
  const ne = jy ? P.conjoint.naissance : '14/03/1968';
  const sexe = jy ? 'M' : 'F';
  return `<table><tr><td style="width:55%">${ministere}
      <div style="margin-top:8px;font-size:7.5px">CENTRE FISCALIS DE QUIMPERLÉ (FICTIF)<br>3 PLACE DES ANCIENS-HALLES<br>29999 QUIMPERLÉ-SIM<br>Tél : 02 99 00 00 00<br>du lundi au vendredi de 8h30 à 12h</div></td>
    <td><div style="border:1px solid #111;padding:5px 7px"><b style="font-size:9px">VOS RÉFÉRENCES</b><table style="margin-top:3px;font-size:8px">
      <tr><td>Numéro fiscal</td><td style="text-align:right"><b>${fmtNF(a.numeroFiscal)}</b></td></tr>

/* ---------- Règles de mot de passe (révélées une par une) ---------- */
const isPassphrase = p => p.length >= 20;
const containsName = p => { const n = norm(p); return ['MARTINE', 'LEGALL', 'KERJEAN'].some(x => n.includes(x)); };
const PWD_RULES = [
  { id: 'len', txt: 'Au moins 12 caractères', test: p => p.length >= 12 },
  { id: 'maj', txt: 'Au moins une lettre majuscule', test: p => isPassphrase(p) || /[A-ZÀ-Ý]/.test(p) },
  { id: 'chif', txt: 'Au moins un chiffre', test: p => isPassphrase(p) || /\d/.test(p) },
  { id: 'spec', txt: 'Au moins un caractère spécial ( ! ? @ # $ % & * - _ . + )', test: p => isPassphrase(p) || /[^A-Za-zÀ-ÿ0-9\s]/.test(p) },
  { id: 'nom', txt: 'Ne doit pas contenir votre nom ou votre prénom', test: p => !containsName(p) }
];
function pwdStrength(p) {
  if (!p) return { pct: 0, lbl: '', col: '#ccc' };
  let s = 0;
  if (p.length >= 8) s++; if (p.length >= 12) s++; if (p.length >= 16) s++;
  if (/[A-Z]/.test(p) && /[a-z]/.test(p)) s++; if (/\d/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p)) s++;
  if (isPassphrase(p)) s = Math.max(s, 6);
  if (containsName(p)) s = Math.min(s, 2);
  const lv = [['Très faible', '#b3261e', 12], ['Très faible', '#b3261e', 15], ['Faible', '#e06c00', 32], ['Faible', '#e06c00', 45], ['Moyen', '#c99a2e', 62], ['Fort', '#3f8f5e', 82], ['Très fort', '#1f6b40', 100]][s];
  return { lbl: 'Robustesse : ' + lv[0], col: lv[1], pct: lv[2] };
}
function rulesHtml(p) {
  const rev = S.fiscalis.revealed;
  if (!rev.length) return '';
  return `<ul class="fx-rules">${PWD_RULES.filter(r => rev.includes(r.id)).map(r => {
    const ok = r.test(p || ''); return `<li class="${ok ? 'ok' : 'ko'}">${ok ? '✔' : '✖'} ${r.txt}</li>`;
  }).join('')}</ul>`;
}
/* Renvoie true si le mot de passe est accepté ; sinon révèle la règle suivante */
function checkPwdRules(p) {
  const failing = PWD_RULES.filter(r => !r.test(p));
  if (!failing.length) return true;
  const next = failing.find(r => !S.fiscalis.revealed.includes(r.id));
  if (next) S.fiscalis.revealed.push(next.id);
  return false;
}
function bindPwdLive(root) {
  const inp = $('input[name=pwd]', root);
  if (!inp || !$('.fx-gauge', root)) return;
  const upd = () => {
    const st = pwdStrength(inp.value);
    $('.fx-gauge i', root).style.cssText = `width:${st.pct}%;background:${st.col}`;
    $('.fx-gaugelbl', root).textContent = st.lbl;
    $('#fx-rules', root).innerHTML = rulesHtml(inp.value);
  };
  inp.addEventListener('input', upd); upd();
}

function fxDocument(id) {
  const d = FX_DOCS.find(x => x.id === id) || FX_DOCS[0];

  const body = paper ? renderDoc(paper)

      }
      case '/espace':
        if (!F.loggedIn) return fxLogin(ctx, 'Votre session a expiré ou vous n\'êtes pas connecté. Veuillez vous identifier.');

      case '/espace/documents':

      case '/espace/document':

      case '/mot-de-passe-oublie':
        return { title: 'Mot de passe oublié | Fiscalis', html: fxPage(`<div class="fx-wrap" style="max-width:760px"><div class="fx-crumb"><span data-go="/">Accueil</span> › <span data-go="/connexion">Votre espace particulier</span> › Mot de passe oublié</div>
          <div class="fx-card"><h2>Mot de passe oublié</h2><p class="sub">Saisissez votre numéro fiscal et l'adresse mail de votre espace. Vous recevrez un lien pour choisir un nouveau mot de passe.</p>
          <div id="fx-msg"></div>
          <form data-form="forgot" autocomplete="off"><div class="fx-field"><label>Numéro fiscal</label><input type="text" name="num" maxlength="20"></div>
            <div class="fx-field"><label>Adresse mail</label><input type="email" name="mail"></div>
            <button class="fx-btn">Envoyer</button> <span class="fx-link" style="margin-left:14px" data-go="/connexion">Retour</span></form></div></div>`) };
      case '/reinitialisation': {
        const r = F.resetTokens[ctx.params.t];
        if (!r || r.used || Date.now() > r.expires) return { title: 'Lien expiré | Fiscalis', html: fxPage(`<div class="fx-wrap" style="max-width:760px"><div class="fx-card"><h2>Réinitialisation du mot de passe</h2>
          <div class="fx-err">Ce lien n'est plus valide. Il a expiré ou a déjà été utilisé.</div><span class="fx-btn" data-go="/mot-de-passe-oublie" style="display:inline-block">Faire une nouvelle demande</span></div></div>`) };
        return { title: 'Nouveau mot de passe | Fiscalis', html: fxPage(`<div class="fx-wrap" style="max-width:760px"><div class="fx-card"><h2>Choisissez un nouveau mot de passe</h2>
          <div id="fx-msg"></div>
          <form data-form="reset" autocomplete="off"><div class="fx-field"><label>Nouveau mot de passe</label><input type="password" name="pwd"><div class="fx-gauge"><i></i></div><div class="fx-gaugelbl"></div><div id="fx-rules"></div></div>
            <div class="fx-field"><label>Confirmation</label><input type="password" name="pwd2"></div><button class="fx-btn">Valider</button></form></div></div>`) };
      }
      case '/reinitialisation/ok':
        return { title: 'Mot de passe modifié | Fiscalis', html: fxPage(`<div class="fx-wrap" style="max-width:760px"><div class="fx-card"><h2>Mot de passe modifié</h2><div class="fx-ok">Votre mot de passe a bien été modifié. Vous pouvez maintenant vous connecter.</div><span class="fx-btn" data-go="/connexion" style="display:inline-block">Me connecter</span></div></div>`) };
    }
    return fxGeneric('Page introuvable');
  },
  after(root, ctx) {
    const F = S.fiscalis;
    bindPwdLive(root);
    // Saisie du code : passage automatique à la case suivante
    const boxes = $$('[data-ci]', root);
    boxes.forEach((b, i) => {
      b.addEventListener('input', () => { b.value = digits(b.value).slice(-1); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); });
      b.addEventListener('keydown', e => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); });
      b.addEventListener('paste', e => { const d = digits(e.clipboardData.getData('text')).slice(0, 6); if (d.length > 1) { e.preventDefault(); d.split('').forEach((c, k) => boxes[k] && (boxes[k].value = c)); (boxes[d.length] || boxes[5]).focus(); } });
    });
    if (boxes[0]) boxes[0].focus();
    // Fin de l'étape 2 : l'avis d'impôt le plus récent est ouvert après le saut dans le temps
    if (ctx.path === '/espace/document' && ctx.params.id === 'avisCetteAnnee' && F.loggedIn
        && S.step === 2 && S.phase2 === 'apres' && !S.waitingCode) later(() => completeStep(2), 4000);
    if (F.justActivated) {
      F.justActivated = false;
      later(() => askSavePassword('fiscalis.gouv.sim', F.account.numero, F.account.password, res => {
        S.incidents.enregistre = res === true;
        if (S.step === 1) later(() => completeStep(1), 900);
      }), 700);
    }
  },
  action(name, el, ctx, root) {
    const F = S.fiscalis;
    switch (name) {
      case 'qm-num': case 'qm-acc': $('#' + name, root).classList.toggle('hidden'); break;
      case 'resend':
        if (F.pending && F.pending.mail === P.mail) deliverMail(mailActivationFiscalis(F.activationToken));
        showErr(root, 'Le mail a été renvoyé.', 'ok'); break;
      case 'newcode':
        sendFiscalisCode();
        showErr(root, `Un nouveau code vous a été envoyé à ${P.mailMasque}. Le code précédent n'est plus valable.`, 'ok'); break;
      case 'cancelcode': F.loginStage = null; F.code = null; navigate('/connexion'); break;
      case 'nope': showErr(root, 'Ce service est momentanément indisponible. Veuillez réessayer ultérieurement.', 'info'); break;
      case 'logout':
        F.loggedIn = false;
        if (S.step === 2 && S.phase2 === 'avant' && !S.waitingCode) { navigate('/'); timeJump(); }
        else navigate('/deconnexion');
        break;
    }
  },
  submit(name, f, ctx, root) {
    const F = S.fiscalis;
    if (name === 'search') { navigate('/page?t=' + encodeURIComponent('Résultats de recherche : ' + (f.q.value || ''))); return; }

    if (name === 'login') {
      const num = digits(f.num.value);
      const pwdBlock = $('#fx-pwdblock', root);
      if (pwdBlock.classList.contains('hidden')) {
        if (num.length !== 13) return showErr(root, 'Le numéro fiscal doit comporter 13 chiffres.');
        if (!(F.account && F.account.active && F.account.numero === num)) {
          if (F.pending && F.pending.numero === num) return showErr(root, 'Votre espace est en cours de création. Pour l\'activer, cliquez sur le lien reçu par mail. <span class="fx-link" data-go="/creation">Recommencer la création</span>');
          return showErr(root, `Ce numéro fiscal ne correspond à aucun espace particulier. S'il s'agit de votre première visite, <span class="fx-link" data-go="/creation?n=${num}">créez votre espace</span>.`, 'info');
        }
        showErr(root, '');
        pwdBlock.classList.remove('hidden');
        f.num.readOnly = true; f.num.style.background = '#eee';
        const sv = savedCreds('fiscalis.gouv.sim');
        if (sv && digits(sv.user) === num) { f.pwd.value = sv.pass; f.pwd.style.background = '#e8f0fe'; }
        $('#fx-loginbtn', root).textContent = 'Connexion';
        f.pwd.focus();
        return;
      }
      if (F.lockedUntil && Date.now() >= F.lockedUntil) { F.lockedUntil = 0; F.failures = 0; }
      if (F.lockedUntil) return showErr(root, '<b>Compte temporairement bloqué.</b> Réessayez dans 15 minutes.');
      if (f.pwd.value !== F.account.password) {
        F.failures++;
        if (F.failures >= 3) {
          F.failures = 0; F.lockedUntil = Date.now() + CONFIG.durees.blocageCompte * 1000; S.incidents.bloque = true;
          return showErr(root, '<b>Compte temporairement bloqué.</b> Réessayez dans 15 minutes.');
        }
        f.pwd.value = ''; f.pwd.style.background = '';
        return showErr(root, F.failures === 2 ? 'Identifiant ou mot de passe incorrect. <b>Il vous reste 1 essai.</b>' : 'Identifiant ou mot de passe incorrect.');
      }
      F.failures = 0; F.lastPwdUsed = f.pwd.value; F.loginStage = num; F.oldCodes = []; F.code = null;
      sendFiscalisCode();
      navigate('/connexion/code');
      return;
    }

    if (name === 'code') {
      const v = $$('[data-ci]', root).map(b => b.value).join('');
      const expired = () => { S.incidents.codeExpire = true; showErr(root, 'Ce code n\'est plus valide. <span class="fx-link" data-act="newcode">Demander un nouveau code</span>'); };
      if (v.length !== 6) return showErr(root, 'Veuillez saisir les 6 chiffres du code.');
      if (F.code && v === F.code.value) {
        if (Date.now() > F.code.expires) return expired();
        F.code = null; F.loginStage = null; F.loggedIn = true;
        navigate('/espace');
        const sv = savedCreds('fiscalis.gouv.sim');
        if (sv && sv.pass !== F.lastPwdUsed) later(() => askSavePassword('fiscalis.gouv.sim', sv.user, F.lastPwdUsed, null, true), 900);
        return;
      }
      if ((F.oldCodes || []).includes(v)) return expired();
      $$('[data-ci]', root).forEach(b => b.value = ''); $('[data-ci]', root).focus();
      return showErr(root, 'Code incorrect.');
    }

    if (name === 'crea1') {
      const num = digits(f.num.value), acc = digits(f.acc.value), nom = f.nom.value, dn = digits(f.naiss.value);
      if (num.length !== 13) return showErr(root, 'Le numéro fiscal doit comporter 13 chiffres.');
      if (acc.length !== 7) return showErr(root, 'Le numéro d\'accès en ligne doit comporter 7 chiffres.');
      if (!nom.trim()) return showErr(root, 'Veuillez saisir votre nom de naissance.');
      if (dn.length !== 8) return showErr(root, 'La date de naissance doit être au format JJ/MM/AAAA.');
      if (num === P.numeroFiscalConjoint || acc === P.accesConjoint) S.incidents.avisConjoint = true;
      if (acc === P.accesAnDernier) S.incidents.avisAnDernier = true;
      const n = P.naissance;
      const dOk = dn === String(n.jour).padStart(2, '0') + String(n.mois).padStart(2, '0') + n.annee;
      if (!(num === P.numeroFiscal && acc === P.accesCetteAnnee && norm(nom) === norm(P.nomNaissance) && dOk))
        return showErr(root, 'Les informations saisies ne permettent pas de vous identifier.');
      if (F.account && F.account.active && F.account.numero === num)
        return showErr(root, 'Vous disposez déjà d\'un espace particulier. <span class="fx-link" data-go="/connexion">Connectez-vous</span>.');
      F.creaNum = num;
      showErr(root, '');
      $('#crea1', root).classList.add('hidden'); $('#crea2', root).classList.remove('hidden');
      $('#st1', root).className = 'done'; $('#st2', root).className = 'on';
      return;
    }

    if (name === 'crea2') {
      const mail = f.mail.value.trim().toLowerCase(), pwd = f.pwd.value;
      if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(mail)) return showErr(root, 'L\'adresse mail saisie n\'est pas valide.');
      if (!checkPwdRules(pwd)) {
        S.incidents.refus++;
        $('#fx-rules', root).innerHTML = rulesHtml(pwd);
        return showErr(root, 'Votre mot de passe ne respecte pas les règles de sécurité.');
      }
      if (pwd !== f.pwd2.value) return showErr(root, 'Les deux mots de passe saisis ne sont pas identiques.');
      if (!f.cgu.checked) return showErr(root, 'Vous devez accepter les conditions générales d\'utilisation.');
      F.pending = { numero: F.creaNum, mail, password: pwd };
      F.activationToken = token();
      if (mail === P.mail) deliverMail(mailActivationFiscalis(F.activationToken));
      navigate('/creation/envoye');
      return;
    }

    if (name === 'forgot') {
      const num = digits(f.num.value), mail = f.mail.value.trim().toLowerCase();
      if (num.length !== 13) return showErr(root, 'Le numéro fiscal doit comporter 13 chiffres.');
      if (F.account && F.account.active && F.account.numero === num && F.account.mail === mail) sendResetMails();
      f.querySelector('button').disabled = true;
      return showErr(root, 'Si les informations saisies correspondent à un espace particulier, vous allez recevoir un mail contenant un lien pour réinitialiser votre mot de passe.', 'ok');
    }

    if (name === 'reset') {
      const r = F.resetTokens[ctx.params.t];
      if (!r || r.used || Date.now() > r.expires) return showErr(root, 'Ce lien n\'est plus valide. <span class="fx-link" data-go="/mot-de-passe-oublie">Faire une nouvelle demande</span>');
      const pwd = f.pwd.value;
      if (!checkPwdRules(pwd)) { $('#fx-rules', root).innerHTML = rulesHtml(pwd); return showErr(root, 'Votre mot de passe ne respecte pas les règles de sécurité.'); }
      if (pwd !== f.pwd2.value) return showErr(root, 'Les deux mots de passe saisis ne sont pas identiques.');
      if (pwd === F.account.password || F.oldPasswords.includes(pwd) || pwd === F.account.initialPassword)
        return showErr(root, 'Le nouveau mot de passe doit être différent de vos anciens mots de passe.');
      F.oldPasswords.push(F.account.password);
      F.account.password = pwd; r.used = true; F.lockedUntil = 0; F.failures = 0;
      navigate('/reinitialisation/ok', curTab(), { replace: true });
    }
  }
};

function numeridAsk(ctx) {

    onOk: () => {
      N.status = null;
      if (!still()) { toast('NumérID : la demande de connexion a expiré.'); return; }

   Martine a une carte d'identité ancien modèle : elle ne peut pas s'en servir.
